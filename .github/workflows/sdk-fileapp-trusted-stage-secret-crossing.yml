name: SDK file-app trusted-stage secret crossing

on:
  push:
    branches:
      - lab/kestrel-chunk-extensions-20260920
    paths:
      - '.github/workflows/sdk-fileapp-trusted-stage-secret-crossing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trusted-stage-secret:
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - '10.0.401'
          - '11.0.100-rc.1.26425.128'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    name: trusted-stage-secret-${{ matrix.sdk }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.sdk }}

      - name: Build-only untrusted stage then trusted stage receives fake secret
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$RUNNER_TEMP/persistent-agent"
          ATTACKER_DIR="$ROOT/trustedtools"
          VICTIM_DIR="$ROOT/TrustedTools"
          A="$ATTACKER_DIR/Program.cs"
          V="$VICTIM_DIR/Program.cs"
          SECRET_VALUE="research-only-secret-${{ matrix.sdk }}"

          rm -rf "$ROOT"
          mkdir -p "$ATTACKER_DIR" "$VICTIM_DIR"

          cat > "$A" <<'EOF'
          #:property RunCommand=/usr/bin/env
          Console.WriteLine("ATTACKER_SOURCE_BODY_SHOULD_NOT_EXECUTE");
          EOF

          cat > "$V" <<'EOF'
          Console.WriteLine("TRUSTED_VICTIM_EXECUTED");
          EOF

          python3 - "$A" "$V" <<'PY'
          import hashlib,sys
          a=hashlib.sha256(sys.argv[1].upper().encode()).hexdigest()
          b=hashlib.sha256(sys.argv[2].upper().encode()).hexdigest()
          print("ATTACKER_HASH="+a)
          print("VICTIM_HASH="+b)
          print("CACHE_IDENTITIES_EQUAL="+str(a==b))
          assert a==b
          PY

          echo "=== UNTRUSTED BUILD-ONLY STAGE ==="
          env -u TRUSTED_STAGE_SECRET dotnet build "$A" > "$ROOT/build.out" 2> "$ROOT/build.err"
          cat "$ROOT/build.out"
          cat "$ROOT/build.err"
          if grep -q 'TRUSTED_STAGE_SECRET=' "$ROOT/build.out" "$ROOT/build.err"; then
            echo "SECRET_PRECONDITION=FAILED_SECRET_PRESENT_IN_UNTRUSTED_STAGE"
            exit 1
          fi
          echo "SECRET_PRECONDITION=PASS_SECRET_ABSENT_DURING_UNTRUSTED_BUILD"

          echo "=== DELETE UNTRUSTED SOURCE/WORKSPACE ==="
          rm -rf "$ATTACKER_DIR"
          test ! -e "$A"
          echo "UNTRUSTED_WORKSPACE_DELETED=true"

          echo "=== TRUSTED STAGE: SECRET EXISTS ONLY NOW ==="
          TRUSTED_STAGE_SECRET="$SECRET_VALUE" dotnet run --file "$V" > "$ROOT/trusted.out" 2> "$ROOT/trusted.err"
          cat "$ROOT/trusted.out"
          cat "$ROOT/trusted.err"

          if grep -Fq "TRUSTED_STAGE_SECRET=$SECRET_VALUE" "$ROOT/trusted.out" && ! grep -q 'TRUSTED_VICTIM_EXECUTED' "$ROOT/trusted.out"; then
            echo "TRUSTED_STAGE_SECRET_RESULT=ATTACKER_PROCESS_INHERITED_TRUSTED_SECRET"
          else
            echo "TRUSTED_STAGE_SECRET_RESULT=FAILED"
            exit 1
          fi

          echo "=== HARD CONTROL: bypass poisoned cache ==="
          TRUSTED_STAGE_SECRET="$SECRET_VALUE" dotnet run --file "$V" --no-cache > "$ROOT/control.out" 2> "$ROOT/control.err"
          cat "$ROOT/control.out"
          cat "$ROOT/control.err"

          if grep -q 'TRUSTED_VICTIM_EXECUTED' "$ROOT/control.out" && ! grep -Fq "TRUSTED_STAGE_SECRET=$SECRET_VALUE" "$ROOT/control.out"; then
            echo "TRUSTED_STAGE_SECRET_NO_CACHE_CONTROL=VICTIM_EXECUTED_WITHOUT_SECRET_DISCLOSURE"
          else
            echo "TRUSTED_STAGE_SECRET_NO_CACHE_CONTROL=FAILED"
            exit 1
          fi

          cp "$ROOT/build.out" "$GITHUB_WORKSPACE/secret-build-${{ matrix.sdk }}.out"
          cp "$ROOT/build.err" "$GITHUB_WORKSPACE/secret-build-${{ matrix.sdk }}.err"
          cp "$ROOT/trusted.out" "$GITHUB_WORKSPACE/secret-trusted-${{ matrix.sdk }}.out"
          cp "$ROOT/trusted.err" "$GITHUB_WORKSPACE/secret-trusted-${{ matrix.sdk }}.err"
          cp "$ROOT/control.out" "$GITHUB_WORKSPACE/secret-control-${{ matrix.sdk }}.out"
          cp "$ROOT/control.err" "$GITHUB_WORKSPACE/secret-control-${{ matrix.sdk }}.err"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-stage-secret-crossing-${{ matrix.sdk }}
          path: |
            secret-*.out
            secret-*.err
