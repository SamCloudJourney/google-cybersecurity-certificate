name: Nested Map HTTP2 evidence

on:
  push:
    branches:
      - lab/kestrel-chunk-extensions-20260920
    paths:
      - '.github/workflows/nested-map-http2-evidence.yml'
      - 'labs/nested-map-evidence/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-http2-local:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.1.26425.128

      - name: Build local evidence server
        shell: pwsh
        run: |
          dotnet build .\labs\nested-map-evidence\NestedMapEvidence.csproj -c Release -p:EvidenceTfm=net11.0
          curl.exe --version

      - name: Run loopback HTTP2 cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:SCENARIO = 'map'
          $env:PROTOCOL = 'http2'
          $env:PORT = '5050'
          $env:NORMALIZE_BACKSLASH = '0'

          $serverLog = Join-Path $PWD 'http2-server.log'
          $serverErr = Join-Path $PWD 'http2-server.err'
          $proc = Start-Process dotnet -ArgumentList @(
            'run','--no-build','-c','Release',
            '--project','.\labs\nested-map-evidence\NestedMapEvidence.csproj',
            '-p:EvidenceTfm=net11.0'
          ) -RedirectStandardOutput $serverLog -RedirectStandardError $serverErr -PassThru

          try {
            for ($i = 0; $i -lt 80; $i++) {
              try {
                $tcp = [System.Net.Sockets.TcpClient]::new('127.0.0.1',5050)
                $tcp.Dispose()
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }

            New-Item -ItemType Directory -Force -Path http2-results | Out-Null

            function Invoke-H2([string]$Name, [string]$Path, [bool]$Authenticated) {
              $headerFile = "http2-results\$Name.headers"
              $bodyFile = "http2-results\$Name.body"
              $args = @(
                '--http2-prior-knowledge',
                '--path-as-is',
                '--silent',
                '--show-error',
                '--dump-header', $headerFile,
                '--output', $bodyFile
              )
              if ($Authenticated) {
                $args += @('-H','X-Admin-Key: research-only')
              }
              $args += "http://127.0.0.1:5050$Path"

              & curl.exe @args
              if ($LASTEXITCODE -ne 0) { throw "curl failed for $Name" }

              $headers = Get-Content $headerFile -Raw
              $body = Get-Content $bodyFile -Raw
              $sha = (Get-FileHash $bodyFile -Algorithm SHA256).Hash
              [ordered]@{
                name = $Name
                path = $Path
                authenticated = $Authenticated
                headers = $headers
                body = $body
                body_sha256 = $sha
              }
            }

            $results = [ordered]@{
              normal_no_auth = Invoke-H2 'normal_no_auth' '/api/admin/secret.txt' $false
              normal_with_auth = Invoke-H2 'normal_with_auth' '/api/admin/secret.txt' $true
              encoded_parent_boundary = Invoke-H2 'encoded_parent_boundary' '/api%5Cadmin%5Csecret.txt' $false
              encoded_parent_boundary_mixed = Invoke-H2 'encoded_parent_boundary_mixed' '/api%5Cadmin/secret.txt' $false
              encoded_child_boundary = Invoke-H2 'encoded_child_boundary' '/api/admin%5Csecret.txt' $false
            }

            $results | ConvertTo-Json -Depth 6 | Set-Content http2-results\results.json
            Get-Content http2-results\results.json

            $normalDenied = $results.normal_no_auth.headers -match '401'
            $normalAllowed = ($results.normal_with_auth.headers -match '200') -and ($results.normal_with_auth.body -match 'TOP_SECRET_7B4F')
            $parentCase = ($results.encoded_parent_boundary.headers -match '200') -and ($results.encoded_parent_boundary.body -match 'TOP_SECRET_7B4F')
            $parentMixedCase = ($results.encoded_parent_boundary_mixed.headers -match '200') -and ($results.encoded_parent_boundary_mixed.body -match 'TOP_SECRET_7B4F')
            $childNegative = $results.encoded_child_boundary.headers -match '401'

            if (-not ($normalDenied -and $normalAllowed -and $parentCase -and $parentMixedCase -and $childNegative)) {
              throw 'HTTP/2 result matrix did not match the expected security controls.'
            }

            if ($results.normal_with_auth.body_sha256 -ne $results.encoded_parent_boundary.body_sha256) {
              throw 'HTTP/2 encoded parent-boundary case did not return the same resource bytes.'
            }

            Start-Sleep -Milliseconds 500
            Write-Host '=== SERVER LOG ==='
            Get-Content $serverLog
            Write-Host '=== SERVER ERR ==='
            Get-Content $serverErr

            if (-not ((Get-Content $serverLog -Raw) -match 'HTTP/2')) {
              throw 'Server log did not confirm HTTP/2 request processing.'
            }
          }
          finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload HTTP2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-map-http2-windows
          path: |
            http2-results
            http2-server.log
            http2-server.err
