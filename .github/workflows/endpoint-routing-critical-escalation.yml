name: Endpoint routing critical escalation evidence

on:
  push:
    branches:
      - lab/kestrel-chunk-extensions-20260920
    paths:
      - '.github/workflows/endpoint-routing-critical-escalation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  endpoint-routing-escalation:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    name: endpoint-routing-${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-rc.1.26425.128

      - name: Build explicit-routing state-changing endpoint harness
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'endpoint-routing-critical'
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          @'
          <Project Sdk="Microsoft.NET.Sdk.Web">
            <PropertyGroup>
              <TargetFramework>net11.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          '@ | Set-Content (Join-Path $root 'Harness.csproj')

          @'
          using Microsoft.AspNetCore.Hosting;
          using Microsoft.AspNetCore.Http;
          using Microsoft.AspNetCore.Http.Features;
          using Microsoft.AspNetCore.Routing;
          using Microsoft.Extensions.DependencyInjection;
          using Microsoft.Extensions.Hosting;

          var markerName = "PRIVILEGED_ACTION_EXECUTED.marker";

          await Host.CreateDefaultBuilder(args)
              .ConfigureWebHostDefaults(web =>
              {
                  web.UseKestrel(o => o.ListenLocalhost(5071));
                  web.ConfigureServices(services =>
                  {
                      services.AddRouting();
                  });
                  web.Configure(app =>
                  {
                      var marker = Path.Combine(AppContext.BaseDirectory, markerName);
                      if (File.Exists(marker))
                      {
                          File.Delete(marker);
                      }

                      var guardHits = 0;
                      var actionHits = 0;

                      app.Use(async (ctx, next) =>
                      {
                          Console.WriteLine($"TOP raw={ctx.Features.Get<IHttpRequestFeature>()?.RawTarget} pathBase={ctx.Request.PathBase.Value} path={ctx.Request.Path.Value}");
                          await next();
                      });

                      // The critical composition under test:
                      // Kestrel decodes %5C, UsePathBase consumes /api and preserves a
                      // leading backslash in the remainder on .NET 11.
                      app.UsePathBase("/api");

                      app.Use(async (ctx, next) =>
                      {
                          Console.WriteLine($"AFTER_PATHBASE raw={ctx.Features.Get<IHttpRequestFeature>()?.RawTarget} pathBase={ctx.Request.PathBase.Value} path={ctx.Request.Path.Value}");

                          if (ctx.Request.Path.StartsWithSegments("/admin"))
                          {
                              Interlocked.Increment(ref guardHits);
                              Console.WriteLine($"AUTH_GUARD_HIT raw={ctx.Features.Get<IHttpRequestFeature>()?.RawTarget} path={ctx.Request.Path.Value}");

                              if (ctx.Request.Headers["X-Admin-Key"] != "research-only")
                              {
                                  ctx.Response.StatusCode = StatusCodes.Status401Unauthorized;
                                  await ctx.Response.WriteAsync("AUTH_REQUIRED");
                                  return;
                              }
                          }

                          await next();
                      });

                      // Force endpoint routing to run AFTER UsePathBase/auth.
                      app.UseRouting();

                      app.UseEndpoints(endpoints =>
                      {
                          endpoints.MapPost("/admin/rotate", async ctx =>
                          {
                              Interlocked.Increment(ref actionHits);
                              File.WriteAllText(marker, "EXECUTED");
                              Console.WriteLine($"PRIVILEGED_ACTION_HIT raw={ctx.Features.Get<IHttpRequestFeature>()?.RawTarget} pathBase={ctx.Request.PathBase.Value} path={ctx.Request.Path.Value}");
                              ctx.Response.StatusCode = StatusCodes.Status200OK;
                              await ctx.Response.WriteAsync("PRIVILEGED_ACTION_EXECUTED");
                          });

                          endpoints.MapGet("/evidence", async ctx =>
                          {
                              await ctx.Response.WriteAsJsonAsync(new
                              {
                                  guardHits,
                                  actionHits,
                                  markerExists = File.Exists(marker),
                                  marker
                              });
                          });
                      });

                      app.Run(async ctx =>
                      {
                          ctx.Response.StatusCode = StatusCodes.Status404NotFound;
                          await ctx.Response.WriteAsync("NOT_FOUND");
                      });
                  });
              })
              .Build()
              .RunAsync();
          '@ | Set-Content (Join-Path $root 'Program.cs')

          dotnet build (Join-Path $root 'Harness.csproj') -c Release
          "HARNESS_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Exercise explicit routing with normal and encoded-backslash POSTs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:HARNESS_ROOT
          $serverLog = Join-Path $root 'server.log'
          $serverErr = Join-Path $root 'server.err'

          $proc = Start-Process dotnet -ArgumentList @(
            'run','--no-build','-c','Release',
            '--project',(Join-Path $root 'Harness.csproj')
          ) -RedirectStandardOutput $serverLog -RedirectStandardError $serverErr -PassThru

          function Invoke-Raw([string]$Target, [bool]$Authenticated) {
              $client = [System.Net.Sockets.TcpClient]::new('127.0.0.1',5071)
              try {
                  $stream = $client.GetStream()
                  $extra = if ($Authenticated) { "X-Admin-Key: research-only`r`n" } else { "" }
                  $req = "POST $Target HTTP/1.1`r`nHost: localhost:5071`r`nContent-Length: 0`r`n" + $extra + "Connection: close`r`n`r`n"
                  $bytes = [Text.Encoding]::ASCII.GetBytes($req)
                  $stream.Write($bytes,0,$bytes.Length)
                  $stream.Flush()
                  $reader = [IO.StreamReader]::new($stream,[Text.Encoding]::Latin1)
                  return $reader.ReadToEnd()
              }
              finally {
                  $client.Dispose()
              }
          }

          try {
              for ($i=0; $i -lt 80; $i++) {
                  try {
                      $tcp=[Net.Sockets.TcpClient]::new('127.0.0.1',5071)
                      $tcp.Dispose()
                      break
                  }
                  catch {
                      Start-Sleep -Milliseconds 250
                  }
              }

              $cases = [ordered]@{
                  normal_no_auth = Invoke-Raw '/api/admin/rotate' $false
                  normal_with_auth = Invoke-Raw '/api/admin/rotate' $true
                  encoded_parent_full = Invoke-Raw '/api%5Cadmin%5Crotate' $false
                  encoded_parent_mixed = Invoke-Raw '/api%5Cadmin/rotate' $false
                  encoded_child = Invoke-Raw '/api/admin%5Crotate' $false
              }

              $summary = [ordered]@{}
              foreach($name in $cases.Keys) {
                  $raw = $cases[$name]
                  $summary[$name] = [ordered]@{
                      status = ($raw -split "`r`n")[0]
                      action = $raw.Contains('PRIVILEGED_ACTION_EXECUTED')
                      auth_required = $raw.Contains('AUTH_REQUIRED')
                      not_found = $raw.Contains('NOT_FOUND')
                      raw = $raw
                  }
              }

              $summary | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $root 'results.json')
              Get-Content (Join-Path $root 'results.json')

              Write-Host '=== SERVER LOG ==='
              Get-Content $serverLog
              Write-Host '=== SERVER ERR ==='
              Get-Content $serverErr

              if (-not $summary.normal_no_auth.status.Contains('401')) {
                  throw 'Normal unauthenticated privileged endpoint did not fail closed.'
              }
              if (-not ($summary.normal_with_auth.status.Contains('200') -and $summary.normal_with_auth.action)) {
                  throw 'Authenticated positive control did not execute privileged action.'
              }
          }
          finally {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload endpoint-routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: endpoint-routing-critical-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/endpoint-routing-critical/results.json
            ${{ runner.temp }}/endpoint-routing-critical/server.log
            ${{ runner.temp }}/endpoint-routing-critical/server.err
